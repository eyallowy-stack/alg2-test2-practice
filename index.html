<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebra 2 Test #2 Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: practice card on the left, "what to work on" coach panel on the right; stacks on phones. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --raise:#f6f7fb; --ink:#18202e; --muted:#5a6477; --line:#d9dfe8;
  --accent:#3346c4; --accent-ink:#ffffff; --accent-soft:#e7eafb;
  --good:#16805a; --good-soft:#e1f3e9; --bad:#c23d2b; --bad-soft:#fbe7e3; --warn:#9a6a10; --warn-soft:#fbf1dc;
  --f:#3346c4; --g:#d4602a; --grid:#e6eaf0; --axis:#8b95a7; --dys-bg:#f8f4e6; --neg:#b3261e;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --math:'STIX Two Text','Cambria Math','Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171c25; --raise:#1e2531; --ink:#e7ebf2; --muted:#9aa3b5; --line:#2b3442;
  --accent:#8c9cff; --accent-ink:#0f131a; --accent-soft:#242c4a;
  --good:#4fc48d; --good-soft:#14302a; --bad:#ff7d67; --bad-soft:#3b201b; --warn:#f0bf5a; --warn-soft:#352a14;
  --f:#8c9cff; --g:#ff9a63; --grid:#222a36; --axis:#66728a; --dys-bg:#1b1a16; --neg:#ff8a73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171c25; --raise:#1e2531; --ink:#e7ebf2; --muted:#9aa3b5; --line:#2b3442;
  --accent:#8c9cff; --accent-ink:#0f131a; --accent-soft:#242c4a;
  --good:#4fc48d; --good-soft:#14302a; --bad:#ff7d67; --bad-soft:#3b201b; --warn:#f0bf5a; --warn-soft:#352a14;
  --f:#8c9cff; --g:#ff9a63; --grid:#222a36; --axis:#66728a; --dys-bg:#1b1a16; --neg:#ff8a73; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
.app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:italic 600 19px var(--math);flex:none}
.brand h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.stats{display:flex;gap:10px}
.stat{position:relative;display:flex;flex-direction:column;align-items:center;min-width:84px;padding:6px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stat .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stat b{font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat.hot{border-color:var(--warn);background:var(--warn-soft)}
.stat.pulse{animation:pulse .5s ease}
.float{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-weight:800;color:var(--good);pointer-events:none;animation:floatUp 1s ease forwards}

/* mode chips */
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:1fr}}

/* practice card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;min-width:0}
.card.enter{animation:enter .35s cubic-bezier(.2,.8,.2,1)}
.card.shake{animation:shake .4s}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.skill{font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.lvl i{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.3}
.lvl i.on{opacity:1}
.prompt{margin:0 0 6px;font-size:1.08rem;font-weight:500}
.math{font-family:var(--math);font-size:1.5rem;line-height:1.7;padding:6px 0 4px;overflow-x:auto}
.m{font-family:var(--math)}
i{font-family:var(--math)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.25;margin:0 .12em}
.fr>span{padding:0 .2em}
.fr>span+span{border-top:1.5px solid currentColor}
.rt{white-space:nowrap}
.rt>span{border-top:1.5px solid currentColor;padding:1px 2px 0;margin-left:1px}
.tw{overflow-x:auto;margin:8px 0}
.tbl{border-collapse:collapse;font-family:var(--math);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px 14px;text-align:center}
.tbl th{background:var(--raise);font-weight:400;white-space:nowrap}
.gwrap{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:8px 0}
.graph{width:100%;max-width:320px;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.graph .gl{stroke:var(--grid);stroke-width:1}
.graph .ax{stroke:var(--axis);stroke-width:1.5}
.graph .tk{fill:var(--muted);font:10px var(--ui)}
.graph .cv{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.graph .cv.f{stroke:var(--f)} .graph .cv.g{stroke:var(--g)}
.graph .dot{stroke-width:2.5}
.graph .dot.f{stroke:var(--f)} .graph .dot.g{stroke:var(--g)}
.graph .dot.closed.f{fill:var(--f)} .graph .dot.closed.g{fill:var(--g)}
.graph .dot.open{fill:var(--surface)}
.graph .fl{font:italic 600 16px var(--math)}
.graph .fl.f{fill:var(--f)} .graph .fl.g{fill:var(--g)}
.legend{display:flex;gap:16px;font-size:.9rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-block;width:18px;height:4px;border-radius:2px}

.answer{margin-top:16px}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s,transform .1s;font-family:var(--math);font-size:1.12rem;min-width:0}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:active:not(:disabled){transform:scale(.99)}
.choice .rad{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:border-color .15s}
.choice .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .15s}
.choice[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-checked="true"] .rad{border-color:var(--accent)}
.choice[aria-checked="true"] .rad::after{transform:scale(1)}
.choice .ct{min-width:0;overflow-x:auto}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .rad{border-color:var(--good)} .choice.right .rad::after{background:var(--good);transform:scale(1)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);cursor:not-allowed}
.choice.wrong .ct{text-decoration:line-through;text-decoration-color:var(--bad);opacity:.75}
.choice:disabled{cursor:default}
.numrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.num{font:1.3rem var(--math);padding:10px 14px;width:min(260px,100%);border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);transition:border-color .15s}
.num:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.num.bad{border-color:var(--bad)} .num.good{border-color:var(--good);background:var(--good-soft)}
.num.shown{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.help{font-size:.85rem;color:var(--muted)}

.hints{display:grid;gap:10px;margin-top:16px}
.hint{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 14px;animation:drop .3s ease}
.hint .hl{display:block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.hint .hb{font-size:1.02rem}
.alts{display:grid;gap:10px;margin-top:10px}
.alts:empty{display:none}
.altbtns{display:flex;flex-wrap:wrap;gap:8px}
.altbtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem;cursor:pointer;transition:filter .15s,transform .1s}
.altbtn:hover{filter:brightness(.97)} .altbtn:active{transform:scale(.97)}
.altbtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.altbox{border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;animation:drop .3s ease}
.altbox h3{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.altbox ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.feedback{min-height:28px;margin-top:14px;display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)} .feedback.info{color:var(--muted);font-weight:600}
.feedback svg{flex:none;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.feedback .link{font-weight:700}
.bar{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.spacer{flex:1}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 26px;font-weight:800;cursor:pointer;transition:filter .15s,transform .1s}
.primary:hover{filter:brightness(1.08)} .primary:active{transform:scale(.97)}
.primary.go{background:var(--good)}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;color:var(--accent);cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--accent)}
.ghost:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* coach panel */
aside{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h2{margin:0 0 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rec .big{font-size:1.15rem;font-weight:800;margin:0 0 4px;text-wrap:balance}
.rec p{margin:0 0 10px;color:var(--muted);font-size:.93rem}
.rec .tip{background:var(--raise);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:.92rem}
.rec .primary{padding:9px 16px;font-size:.92rem}
.rec .also{font-size:.85rem;margin-top:10px}
.skills{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sk{display:grid;gap:5px}
.sk .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sk .nm{font-weight:700;font-size:.95rem}
.st{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.new{background:var(--raise);color:var(--muted)}
.st.lv{background:var(--accent-soft);color:var(--accent)}
.st.weak{background:var(--bad-soft);color:var(--bad)}
.st.done{background:var(--good-soft);color:var(--good)}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.segs span{height:7px;border-radius:4px;background:var(--grid);overflow:hidden;position:relative}
.segs span::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(var(--p,0));transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.segs.done span::after{background:var(--good)}
.sk small{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.session{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.85rem}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .4s cubic-bezier(.2,1.3,.4,1);z-index:20;text-align:center}
.toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:19}

/* dyslexia mode: readable face, more spacing, warm ground, bold variables, loud minus signs */
.stats{flex-wrap:wrap}
.dystog{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.dystog .sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.dystog .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .2s}
.dystog[aria-pressed="true"]{border-color:var(--accent)}
.dystog[aria-pressed="true"] .sw{background:var(--accent)}
.dystog[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.speak{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.82rem;color:var(--accent);cursor:pointer}
.speak:hover{border-color:var(--accent)}
.whynote{flex-basis:100%;font-weight:400;color:var(--ink);background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:10px;padding:8px 12px;line-height:1.45}
.trapnote{flex-basis:100%;font-weight:600;color:var(--ink);background:var(--warn-soft);border-radius:10px;padding:8px 12px}
body.dys{--ui:'Atkinson Hyperlegible',Verdana,Tahoma,sans-serif;--math:'Atkinson Hyperlegible',Verdana,Tahoma,sans-serif;background:var(--dys-bg);letter-spacing:.03em;word-spacing:.14em;line-height:1.7}
body.dys i{font-style:normal;font-weight:700}
body.dys .math{font-size:1.7rem;letter-spacing:.06em;word-spacing:.28em}
body.dys .prompt{font-size:1.15rem}
body.dys .choice{font-size:1.22rem;letter-spacing:.04em;word-spacing:.2em;padding:14px 16px}
body.dys .hint .hb,body.dys .altbox li{font-size:1.08rem}
body.dys .tbl{font-size:1.25rem;letter-spacing:.05em}
body.dys .neg{color:var(--neg);font-weight:800;padding:0 .1em}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">m</div>
      <div>
        <h1>Test #2 Prep</h1>
        <p>Honors Algebra 2 · Ms. Fass · test on Wednesday, Nov 11</p>
      </div>
    </div>
    <div class="stats">
      <button class="dystog" id="lightBtn" type="button" aria-pressed="false"><span class="sw" aria-hidden="true"></span>Light mode</button>
      <button class="dystog" id="dysBtn" type="button" aria-pressed="false"><span class="sw" aria-hidden="true"></span>Dyslexia mode</button>
      <div class="stat" id="streakBox"><span class="lbl">Streak</span><b id="streak">0</b></div>
      <div class="stat" id="pointsBox"><span class="lbl">Points</span><b id="points">0</b></div>
    </div>
  </header>

  <nav class="modes" id="modes" aria-label="Choose what to practice"></nav>

  <div class="layout">
    <main>
      <article class="card" id="card">
        <div class="qhead"><span class="skill" id="qSkill"></span><span class="lvl" id="qLevel"></span><button class="speak" id="speakBtn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Read aloud</button></div>
        <div id="qBody"></div>
        <div class="answer" id="answer"></div>
        <div class="hints" id="hints"></div>
        <div class="alts" id="alts"></div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="bar">
          <button id="hintBtn" class="ghost" type="button">Get a hint</button>
          <div class="spacer"></div>
          <button id="checkBtn" class="primary" type="button">Check</button>
        </div>
      </article>
    </main>
    <aside>
      <section class="panel rec" id="rec" aria-live="polite"></section>
      <section class="panel">
        <h2>Your topics</h2>
        <ul class="skills" id="skills"></ul>
        <div class="session" id="session"></div>
        <div class="foot"><span>Topics come from your review sheet, homework, and Quizzes #3 and #4. The piecewise packet on OneNote wasn't used, so piecewise practice is built from the review sheet.</span></div>
        <div class="foot"><button id="resetBtn" class="link" type="button">Reset progress</button></div>
      </section>
    </aside>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const X='<i>x</i>', H='<i>h</i>', Y='<i>y</i>';
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const nz=(a,b)=>{let v;do{v=R(a,b)}while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const N=n=>n<0?'−'+(-n):''+n;
/* NA: a numeric answer as the student would write it: whole number, or a reduced fraction like −5/3 (never a long decimal).
   A topic sets q.dec = true when a decimal is the natural form (money, measurements). */
const NA=(v,dec)=>{if(Number.isInteger(v)||dec)return N(+v.toFixed(4));for(let d=2;d<=1000;d++){const p=Math.round(v*d);if(Math.abs(p/d-v)<1e-9){const g=gcd(Math.abs(p),d)||1;return N(p/g)+'/'+(d/g)}}return N(+v.toFixed(4))};
const sgn=n=>n<0?'−':'+';
const co=a=>a===1?'':a===-1?'−':N(a);
const tail=n=>n?` ${sgn(n)} ${Math.abs(n)}`:'';
const F=n=>`<i>${n}</i>`;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const rt=s=>`<span class="rt">√<span>${s}</span></span>`;
const sq='<sup>2</sup>';
const I=s=>s.replace(/-/g,'−').replace(/[a-zA-Z]/g,'<i>$&</i>').replace(/\^(\d)/g,'<sup>$1</sup>');
const M=s=>`<span class="m">${s}</span>`;
function lc(terms){let s='';for(const [c,v] of terms){if(!c)continue;const a=Math.abs(c);const t=v?(a===1?'':a)+v:''+a;s+=s?` ${sgn(c)} ${t}`:(c<0?'−':'')+t}return s||'0'}
function pf(p,v=X){const t=[];for(let i=p.length-1;i>=0;i--)t.push([p[i],i===0?'':v+(i>1?`<sup>${i}</sup>`:'')]);return lc(t)}
const trim=p=>{p=[...p];while(p.length>1&&p[p.length-1]===0)p.pop();return p};
const padd=(a,b)=>trim(Array.from({length:Math.max(a.length,b.length)},(_,i)=>(a[i]||0)+(b[i]||0)));
const pmul=(a,b)=>{const r=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y));return trim(r)};
const pscale=(a,k)=>a.map(x=>x*k);
const pcomp=(f,g)=>{let r=[0],pw=[1];for(let i=0;i<f.length;i++){r=padd(r,pscale(pw,f[i]));pw=pmul(pw,g)}return trim(r)};
const peval=(p,x)=>p.reduce((s,c,i)=>s+c*x**i,0);
const INF='∞', NI='−∞';
const ex1=a=>`(${NI}, ${N(a)}) ∪ (${N(a)}, ${INF})`;
const ex2=(a,b)=>{const p=Math.min(a,b),q=Math.max(a,b);return `(${NI}, ${N(p)}) ∪ (${N(p)}, ${N(q)}) ∪ (${N(q)}, ${INF})`};
const ALL=`(${NI}, ${INF})`;
const setS=a=>'{'+a.map(N).join(', ')+'}';
const uniqSort=a=>[...new Set(a)].sort((x,y)=>x-y);
function tbl(rows){return `<div class="tw"><table class="tbl">${rows.map(r=>`<tr><th>${r[0]}</th>${r.slice(1).map(c=>`<td>${typeof c==='number'?N(c):c}</td>`).join('')}</tr>`).join('')}</table></div>`}
function mc(correct,wrongs,keep){const seen=new Set([correct]),ds=[];for(const w of wrongs){if(w&&!seen.has(w)){seen.add(w);ds.push(w)}if(ds.length===3)break}return{type:'mc',correct,choices:keep?[correct,...ds]:shuffle([correct,...ds])}}
/* mc with a reason for each wrong choice: mcw(correct, [[wrong, why], ...], keep). The why is shown
   when a student picks that choice, so it should name the exact mistake that produces that answer. */
function mcw(correct,pairs,keep){const why={};for(const [w,y] of pairs)if(w&&w!==correct&&y&&!(w in why))why[w]=y;
  return Object.assign(mc(correct,pairs.map(p=>p[0]),keep),{why})}
const num=(answer,extra)=>Object.assign({type:'num',answer},extra);
const fq=(p,q)=>{if(q<0){p=-p;q=-q}const g=gcd(p,q)||1;p/=g;q/=g;return{neg:p<0,t:q===1?''+Math.abs(p):fr(Math.abs(p),q)}};

function checkAlt(x0,sides,rightConst){
  const steps=[`Plug ${M(X+' = '+N(x0))} back into the original equation.`];
  sides.forEach(([e,v],i)=>steps.push(`${i?'Right':'Left'} side: ${M(e+' = '+N(v))}`));
  if(rightConst!==undefined)steps.push(`Right side: ${M(N(rightConst))}`);

function sub(outer,inner){if(outer.length===2)return `${co(outer[1])}(${inner})${tail(outer[0])}`;
  const [c,b,a]=outer;return `${co(a)}(${inner})${sq}${b?` ${sgn(b)} ${Math.abs(b)===1?'':Math.abs(b)}(${inner})`:''}${tail(c)}`}
function walk(){const v=[R(-3,3)];for(let i=1;i<9;i++){let n;do{n=v[i-1]+pick([-2,-1,0,1,2])}while(n<-4||n>4);v.push(n)}return v}

function svgGraph({segs=[],curves=[],label='graph'}){
  let s=`<svg class="graph" viewBox="0 0 300 300" role="img" aria-label="${label}"><defs><clipPath id="clipG"><rect width="300" height="300" rx="12"/></clipPath></defs><g clip-path="url(#clipG)">`;

  s+=`<line class="ax" x1="0" y1="150" x2="300" y2="150"/><line class="ax" x1="150" y1="0" x2="150" y2="300"/>`;
  for(let i=-5;i<=5;i++){if(!i)continue;s+=`<text class="tk" x="${GX(i)}" y="163" text-anchor="middle">${N(i)}</text><text class="tk" x="144" y="${GY(i)+3.5}" text-anchor="end">${N(i)}</text>`}
  curves.forEach(c=>{s+=`<path class="cv ${c.cls||'f'}" d="${c.d}"/>`});

    s+=`<polyline class="cv ${c}" points="${sg.pts.map(p=>GX(p[0])+','+GY(p[1])).join(' ')}"/>`;
    if(sg.ends){const a=sg.pts[0],b=sg.pts[sg.pts.length-1];[[a,sg.ends[0]],[b,sg.ends[1]]].forEach(([p,t])=>{if(t)s+=`<circle class="dot ${t} ${c}" cx="${GX(p[0])}" cy="${GY(p[1])}" r="4.5"/>`})}

  const defs=`Let ${f1}(${v1}) be ${c.d1(v1)}, and let ${f2}(${v2}) be ${c.d2(v2)}.`;

function genChain(){
  const t=pick(['num','sent','which','repr']);
  const S=chainSetup(),{c,a,m,o,k,table,defs,f1,f2,v1,v2}=S;
  const step1=`Inside first. Find ${v1} = ${a} in the top table: ${M(f1+'('+a+') = '+m)}.`,step2=`Now ${m} is the input of ${f2}. Find ${v2} = ${m} in the bottom table: ${M(f2+'('+m+') = '+o)}.`;
  if(t==='num'){
    const wn=[[k,`You looked up ${M(f2+'('+a+')')} and skipped ${f1}. ${a} is in ${c.inU}, but ${f2} needs ${c.midU}. Use ${M(f1+'('+a+') = '+m)} first.`],
      [m,`${m} is only the inner step, ${M(f1+'('+a+')')}. Use it as the input of ${f2}.`]].filter(p=>p[0]!==o);
    return num(o,{prompt:`${defs} Find ${f2}(${f1}(${a})).`,table,way:'Inside out with the tables',whyNum:wn,
      hints:[step1,step2,`So ${M(f2+'('+f1+'('+a+')) = '+o)}.`]});
  }
  if(t==='sent'){
    const fn=(txt)=>txt;
    return Object.assign(mcw(c.right(a,o),shuffle([
      [c.swap(a,o),`You swapped the two numbers. ${M(f2+'('+f1+'('+a+')) = '+o)}: the ${a} (${c.inU}) goes in, and the ${o} (${c.outU}) comes out.`],
      [c.back(a,o),`${o} is a number of ${c.outU}, not ${c.midU}. The ${c.midU} only comes from the middle step, ${M(f1+'('+a+') = '+m)}.`],
      [c.inner(a,m),`${m} is only the inner step, ${M(f1+'('+a+') = '+m)}. Finish with ${M(f2+'('+m+') = '+o)} to get ${c.outU}.`],
      [c.skip(a,k),`That is ${M(f2+'('+a+') = '+k)}: you used ${a} as the ${c.midU}, but ${a} is ${c.inU}. The ${f1} step was skipped.`]])),{
      prompt:`${defs} Find ${f2}(${f1}(${a})) and interpret it with units.`,table,way:'Inside out, then state it with units',
      hints:[step1,step2,`${M(f2+'('+f1+'('+a+')) = '+o)}. In words, with units: “${c.right(a,o)}”`]});
  }
  if(t==='which'){
    const A=`${f2}(${f1}(${v1}))`,B=`${f1}(${f2}(${v2}))`;
    return Object.assign(mcw(`${A} makes sense: ${f1} gives ${c.midU}, and ${f2} takes ${c.midU} as its input.`,shuffle([
      [`${B} makes sense: ${f2} gives ${c.outU}, and ${f1} takes ${c.outU} as its input.`,`${f1} takes ${c.inU} as its input, not ${c.outU}. The output of the inner function must match the input of the outer one, so ${B} fails.`],
      [`Both make sense, because you can compose two functions in either order.`,`The order matters: the output of the inner function has to be the kind of thing the outer function accepts. Only one order matches the units.`],
      [`Neither makes sense, because the two functions measure different things.`,`That is exactly why they chain: ${f1} outputs ${c.midU}, which is what ${f2} needs as input.`]])),{
      prompt:`${defs} Which composite makes sense?`,way:'Match output units to input units',
      hints:[`Check the units. ${f1} takes ${c.inU} and gives ${c.midU}. ${f2} takes ${c.midU} and gives ${c.outU}.`,`In a composite, the inner function's output is the outer function's input. ${f1} gives ${c.midU}, and ${f2} takes ${c.midU}.`,`So ${M(A)} makes sense, with ${f1} inside.`]});
  }
  const A=`${f2}(${f1}(${v1}))`;
  return Object.assign(mcw(c.mean(v1),shuffle([
    [c.meanInner(v1),`That is only ${M(f1+'('+v1+')')}. The outer function ${f2} then changes it into ${c.outU}, which is what the composite gives.`],
    [c.meanSkip(v1),`That uses ${v1} as the input of ${f2}. But ${v1} is in ${c.inU} and ${f2} needs ${c.midU}, so ${f1} has to go first.`],
    [c.meanInv(v1),`That runs ${f1} backwards. In ${M(A)} the ${v1} goes into ${f1}, so it is a number of ${c.inU}.`]])),{
    prompt:`${defs} What does ${M(A)} represent?`,way:'Read from the inside out',
    hints:[`Inside first: ${M(f1+'('+v1+')')} is ${c.d1(v1)}.`,`That result, in ${c.midU}, is the input to ${f2}, which gives ${c.outU}.`,`So ${M(A)} is ${c.mean(v1)}.`]});
}

function genVerbal(L){return L===3?genChain():genContext(L)}

TOPICS.push({id:'verbal',name:'Verbal descriptions of functions',
  tip:`Say each function as a sentence: input (with units) → output (with units). In ${F('f')}(${F('g')}(${X})), ${F('g')}’s output becomes ${F('f')}’s input. For ${inv('f')}, the input and output switch.`,
  gen:genVerbal});
})();

// Topic: Slope  (Honors Algebra 2, Test #2)
(()=>{
/* ---------- helpers ---------- */
const pr=n=>n<0?`(${N(n)})`:N(n);                       // parenthesize negatives in a subtraction

function fv(p,q){                                        // reduced value as HTML (integer or stacked fraction)

const lineStd=(A,B,C)=>`${lc([[A,X],[B,Y]])} = ${N(C)}`;  // Ax + By = C
function stdWith(m,c){return m>0?lineStd(m,-1,c):lineStd(-m,1,c)}  // a line with slope m, A > 0
const fmtK=(lo,hi)=>`${F('k')} = ${N(lo)} or ${F('k')} = ${N(hi)}`;

/* ---------- Level 1 ---------- */
function slopeTwo(){
  let x1,y1,x2,y2,dx,dy;
  do{x1=R(-8,8);y1=R(-8,8);x2=R(-8,8);y2=R(-8,8);dx=x2-x1;dy=y2-y1}while(dx===0||dy===0||Math.abs(dx)===Math.abs(dy));
  const m=dy/dx,fm=fv(dy,dx);

            [-m,`The signs went wrong. You subtracted the ${Y}’s in one order and the ${X}’s in the other. Keep the same order on top and bottom: ${M(fr(N(y2)+' − '+pr(y1),N(x2)+' − '+pr(x1)))} = ${M(fm)}.`]];
  return num(m,{prompt:`Find the slope of the line through the two points.`,math:`${pt(x1,y1)} and ${pt(x2,y2)}`,way:`Second point minus first`,whyNum:wn,
    hints:[`Use ${M('m = '+fr(`${Y}<sub>2</sub> − ${Y}<sub>1</sub>`,`${X}<sub>2</sub> − ${X}<sub>1</sub>`))} with ${M(X+'<sub>1</sub> = '+N(x1)+', '+Y+'<sub>1</sub> = '+N(y1))} and ${M(X+'<sub>2</sub> = '+N(x2)+', '+Y+'<sub>2</sub> = '+N(y2))}.`,
      `Plug in, same order top and bottom: ${M(fr(N(y2)+' − '+pr(y1),N(x2)+' − '+pr(x1))+' = '+fr(dy,dx))}`,
      `Reduce: ${M('m = '+fm)}.`],
    alts:[{name:'Subtract in the other order',steps:[`Start with the other point: ${M(fr(N(y1)+' − '+pr(y2),N(x1)+' − '+pr(x2))+' = '+fr(-dy,-dx))}`,`Both signs flip, so the fraction is the same: ${M('m = '+fm)}. Just never mix the orders.`]}]});
}
function slopeHoriz(){
  let x1,x2,y;do{x1=R(-9,9);x2=R(-9,9)}while(x1===x2);y=R(-9,9);
  const wn=y!==0?[[y,`${N(y)} is the ${Y}-value of the line, not its slope. The ${Y}’s are equal, so the rise is ${M(N(y)+' − '+pr(y)+' = 0')} and the slope is 0.`]]:[];
  return num(0,{prompt:`Find the slope of the line through the two points.`,math:`${pt(x1,y)} and ${pt(x2,y)}`,whyNum:wn,
    hints:[`Rise: ${M(N(y)+' − '+pr(y)+' = 0')}. Run: ${M(N(x2)+' − '+pr(x1)+' = '+N(x2-x1))}.`,`${M(fr(0,N(x2-x1))+' = 0')}`,`The ${Y}’s match, so it is a horizontal line, and a horizontal line has slope 0.`]});
}
function slopeVert(){
  let y1,y2,x;do{y1=R(-9,9);y2=R(-9,9)}while(y1===y2);x=R(-9,9);

    ['The slope is 0',`0 is the slope of a horizontal line, where the ${Y}’s match. Here the ${X}’s match, so the run is 0 and you would divide by 0.`],
    ['The slope is 1',`Nothing in ${M(fr(N(dy),0))} makes 1. The run is ${M(N(x)+' − '+pr(x)+' = 0')}, and dividing by 0 is impossible, so the slope is undefined.`],
    [`The slope is ${N(dy)}`,`${N(dy)} is only the rise. Slope is rise over run, and the run is 0, so ${M(fr(N(dy),0))} is undefined.`]]),{
    prompt:`Find the slope of the line through the two points.`,math:`${pt(x,y1)} and ${pt(x,y2)}`,

/* ---------- Level 2 ---------- */
function stdSlope(){
  let A,B;do{A=nz(-9,9);B=nz(-9,9)}while(Math.abs(A)===Math.abs(B));

    whyNum:[[A/B,`You forgot the minus sign. Moving ${M(lc([[A,X]]))} to the other side changes its sign, so the slope is ${M('−'+fr('A','B'))} = ${M(fm)}.`],
            [B/A,`You flipped it. The slope is ${M('−'+fr('A','B'))}: the ${X}-number goes on top, not the ${Y}-number.`],
            [-B/A,`You flipped it. The ${X}-number (${N(A)}) goes on top and the ${Y}-number (${N(B)}) on the bottom: ${M('−'+fr('A','B')+' = '+fm)}.`]].filter(p=>Math.abs(p[0]-m)>1e-9),
    hints:[`In ${M('Ax + By = C')}, A = ${N(A)} and B = ${N(B)}.`,`Slope = ${M('−'+fr('A','B')+' = −'+fr(pr(A),pr(B)))}`,`Reduce: ${M('m = '+fm)}.`],
    alts:[{name:`Solve for ${Y}`,steps:[`Subtract ${M(lc([[A,X]]))} from both sides: ${M(lc([[B,Y]])+' = '+lc([[-A,X]])+tail(C))}`,`Divide everything by ${N(B)}: ${M(Y+' = '+lc2(-A,B,X)+' '+(C/B<0?'−':'+')+' '+fvAbs(C,B))}`,`The number in front of ${X} is the slope: ${M(fm)}.`]}]});

function lc2(p,q,v){const f=fv(p,q);return f==='1'?v:f==='−1'?'−'+v:f+v}
function fvAbs(p,q){return fv(Math.abs(p),Math.abs(q))}
function parPerp(){
  const perp=Math.random()<.55;let A,B;do{A=nz(-9,9);B=nz(-9,9)}while(Math.abs(A)===Math.abs(B));
  const C=nz(-18,18),m=-A/B,ans=perp?B/A:m,fm=fv(-A,B),fa=perp?fv(B,A):fm;
  const wn=perp?[[m,`That is the slope of the given line itself. A perpendicular line has the negative reciprocal: ${M(fm)} → ${M(fa)}.`],
                 [-m,`You changed the sign but did not flip the fraction. Negative reciprocal means flip it <i>and</i> change the sign: ${M(fm)} → ${M(fa)}.`],
                 [1/m,`You flipped the fraction but kept the sign. Negative reciprocal means flip it <i>and</i> change the sign: ${M(fm)} → ${M(fa)}.`]]
                :[[-m,`You forgot the minus sign. The slope of ${M('Ax + By = C')} is ${M('−'+fr('A','B'))} = ${M(fm)}.`],
                  [1/m,`You flipped the fraction. That is what you do for a perpendicular line, but parallel lines have the <i>same</i> slope: ${M(fm)}.`],
                  [-1/m,`That is the slope of a perpendicular line. Parallel lines have the <i>same</i> slope: ${M(fm)}.`]];
  return num(ans,{prompt:`Find the slope of a line ${perp?'perpendicular':'parallel'} to the line.`,math:lineStd(A,B,C),way:perp?'Slope, then negative reciprocal':'Same slope',
    whyNum:wn.filter(p=>Math.abs(p[0]-ans)>1e-9),
    hints:perp?[`First find the slope of the given line: ${M('−'+fr('A','B')+' = −'+fr(pr(A),pr(B))+' = '+fm)}.`,`Perpendicular slopes are negative reciprocals. Flip ${M(fm)} and change its sign.`,`${M('m = '+fa)}. Check: ${M(fm+' · '+fa+' = −1')}.`]
              :[`Parallel lines have the same slope, so find the slope of the given line.`,`${M('−'+fr('A','B')+' = −'+fr(pr(A),pr(B)))}`,`${M('m = '+fm)}.`],
    alts:perp?[{name:'Check the product',steps:[`Perpendicular slopes multiply to −1.`,`${M(fm+' · '+fa+' = −1')}, so ${M(fa)} is right.`]}]:undefined});
}

/* ---------- Level 3 ---------- */
function kPoints(){                               // (k, y1) and (nk, y2) parallel to mx − y = c
  const m=pick([2,3,4,-2,-3,5]),n=pick([2,3,4]),k0=nz(-5,5),y1=R(-6,6),y2=y1+m*k0*(n-1),c=nz(-9,9),dy=y2-y1,r=(n-1);
  const K=F('k');
  return num(k0,{prompt:`Find the value of ${K} such that the line through the two points is parallel to the given line.`,
    math:`(${K}, ${N(y1)}) and (${n}${K}, ${N(y2)}) &nbsp;&nbsp; ∥ &nbsp;&nbsp; ${stdWith(m,c)}`,
    whyNum:[[-k0,`Check the signs on the last step: ${N(dy)} ÷ ${N(m*r)} is ${N(k0)}, not ${N(-k0)}.`]],
    hints:[`Parallel means equal slopes. The given line has slope ${M(N(m))}.`,
      `Slope between the points: ${M(fr(N(y2)+' − '+pr(y1),n+K+' − '+K)+' = '+fr(N(dy),(r===1?'':r)+K))}`,
      `Set them equal: ${M(fr(N(dy),(r===1?'':r)+K)+' = '+N(m))}. Multiply both sides by ${M((r===1?'':r)+K)}: ${M(N(dy)+' = '+N(m*r)+K)}`,
      `Divide by ${N(m*r)}: ${M(K+' = '+N(k0))}.`],
    alts:[{name:'Check by plugging in',steps:[`Put ${M(K+' = '+N(k0))} back in: the points are ${pt(k0,y1)} and ${pt(n*k0,y2)}.`,`Slope: ${M(fr(N(y2)+' − '+pr(y1),N(n*k0)+' − '+pr(k0))+' = '+fr(N(dy),N(r*k0))+' = '+N(m))}. It matches the given line.`]}]});
}
function kStd(){                                  // kx + By = C parallel to Ax + B'y = C'
  const K=F('k');let A,Bp,t,B;
  do{A=nz(-6,6);Bp=pick([1,-1,2,-2,3,-3]);t=nz(-4,4);B=Bp*t}while(Math.abs(A*t)<2||Math.abs(B)===1);
  const k0=A*t,C=nz(-12,12),C2=nz(-12,12),mLine=fv(-A,Bp);
  const left=`${K}${X} ${sgn(B)} ${Math.abs(B)===1?'':Math.abs(B)}${Y} = ${N(C)}`;
  return num(k0,{prompt:`Find the value of ${K} so the two lines are parallel.`,math:`${left} &nbsp;&nbsp; ∥ &nbsp;&nbsp; ${lineStd(A,Bp,C2)}`,
    whyNum:[[-k0,`Check your signs. Both slopes have a minus in front, so those cancel: ${M(fr(K,N(B))+' = '+fv(A,Bp))}, which gives ${M(K+' = '+N(k0))}.`]],
    hints:[`Slope of the second line: ${M('−'+fr('A','B')+' = −'+fr(pr(A),pr(Bp))+' = '+mLine)}.`,
      `Slope of the first line: ${M('−'+fr(K,N(B)))}.`,
      `Set them equal: ${M('−'+fr(K,N(B))+' = '+mLine)}. Multiply both sides by ${N(B)}: ${M('−'+K+' = '+N(B)+' · '+(mLine.includes('fr')||mLine.includes('<')?'('+mLine+')':pr(-A/Bp))+' = '+N(-k0))}`,
      `So ${M(K+' = '+N(k0))}.`],
    alts:[{name:'Check by plugging in',steps:[`Put ${M(K+' = '+N(k0))} in: ${M(lineStd(k0,B,C))}.`,`Its slope is ${M('−'+fr(N(k0),N(B))+' = '+fv(-k0,B))}, the same as ${M(mLine)}. ✓`]}]});
}
function kQuad(){                                  // (k,k^2) and (p,q) parallel to a line with slope m
  let r1,r2,m,p;
  do{r1=nz(-5,5);r2=nz(-5,5);m=r1+r2;p=R(-4,5)}while(r1>=r2||m===0||Math.abs(m)>6||p===r1||p===r2||m===r1||m===r2);
  const q=m*p-r1*r2,c=nz(-9,9),K=F('k'),k2=K+sq;
  const lo=r1,hi=r2,b0=m*p-q;

  const eqKQ=`${k2}${tail(-q)}`,den=`${K}${tail(-p)}`;

  return Object.assign(mcw(correct,[
    [fmtK(-hi,-lo),`The factors are ${M('('+K+tail(-lo)+')('+K+tail(-hi)+')')}, so ${K} = ${N(lo)} or ${N(hi)}. The numbers in the factors are the opposites of the answers.`],
    [`${K} = ${N(hi)} only`,`A quadratic can have two solutions. ${K} = ${N(lo)} works too: its slope is ${M(fr(N(lo*lo-q),N(lo-p))+' = '+N(m))}.`],
    [`${K} = ${N(m)}`,`${N(m)} is the middle number of the quadratic, not a solution. Factor ${M(lc([[1,k2],[-m,K],[b0,'']])+' = 0')} to get both answers.`]]),{
    prompt:`The line through the two points is parallel to the given line. Find all possible values of ${K}.`,
    math:`${ptS} &nbsp;&nbsp; ∥ &nbsp;&nbsp; ${stdWith(m,c)}`,
    way:'Set the slopes equal',
    hints:[`The given line has slope ${M(N(m))}.`,
      `Slope between the points: ${M(fr(eqKQ,den))}. Set it equal to ${N(m)}: ${M(fr(eqKQ,den)+' = '+N(m))}`,
      `Multiply by ${M(den)}, then move everything to one side: ${M(eqKQ+' = '+N(m)+'('+den+')')} becomes ${M(lc([[1,k2],[-m,K],[b0,'']])+' = 0')}`,
      `Factor: ${M('('+K+tail(-lo)+')('+K+tail(-hi)+') = 0')}, so ${M(correct)}. (Neither makes the bottom ${M(den)} zero.)`],
    alts:[{name:'Check both answers',steps:[`Slope with ${M(K+' = '+N(lo))}: ${alt(lo)}`,`Slope with ${M(K+' = '+N(hi))}: ${alt(hi)}`,`Both match the slope ${N(m)}, so both are answers.`]}]});
}
function genSlope(L){
  if(L===1){const t=Math.random();return t<.55?slopeTwo():t<.75?slopeHoriz():slopeVert()}

// ---- 04-aroc.js
// Topic: Average rate of change  (Honors Algebra 2, Test #2)
(()=>{
/* ---------- Average rate of change ---------- */
const fh=(p,q)=>{if(q<0){p=-p;q=-q}const g=gcd(Math.abs(p),q)||1;p/=g;q/=g;return q===1?N(p):(p<0?'−':'')+fr(Math.abs(p),q)};
const pn=n=>n<0?`(${N(n)})`:N(n);
const ival=(a,b)=>`[${N(a)}, ${N(b)}]`;
// the formula line with the numbers put in, then simplified
function formulaSteps(nm,a,b,fa,fb){
  const d=fb-fa,len=b-a,top=fr(`${N(fb)} − ${pn(fa)}`,`${N(b)} − ${pn(a)}`),res=fr(N(d),N(len)),done=fh(d,len);
  return [`Subtract in the same order, top and bottom: ${M(`${fr(`${F(nm)}(${N(b)}) − ${F(nm)}(${N(a)})`,`${N(b)} − ${pn(a)}`)} = ${top} = ${res}`)}`,
    gcd(Math.abs(d),Math.abs(len))===1?`The answer is ${M(done)}.`:`Simplify the fraction: ${M(res+' = '+done)}. The answer is ${M(done)}.`];
}
function wrongNums(a,b,fa,fb,nm){
  const d=fb-fa,len=b-a,ans=d/len,out=[];
  const add=(v,why)=>{if(Number.isFinite(v)&&Math.abs(v-ans)>1e-9&&!out.some(p=>Math.abs(p[0]-v)<1e-9))out.push([v,why])};
  if(d!==0)add(len/d,`You flipped the fraction. AROC is change in output over change in input: ${M(fr(N(d),N(len)))}, not ${M(fr(N(len),N(d)))}.`);
  if(len!==1)add(d,`That is the total change in the outputs, ${N(d)}. AROC is a rate, so divide by the change in input, ${N(len)}.`);
  add((fa+fb)/2,`That is the average of the two outputs. AROC is the change in output divided by the change in input: ${M(fr(N(d),N(len)))}.`);
  add(-ans,`The order got mixed up. If ${F(nm)}(${N(b)}) comes first on top, ${N(b)} comes first on the bottom: ${M(fr(N(d),N(len)))}.`);
  return out;
}
const checkAlt=(a,b,fa,fb)=>{const d=fb-fa,len=b-a;return{name:'Check by multiplying back',steps:[`AROC times the length of the interval should give the total change in output.`,`${M(`${fh(d,len)} · ${N(len)} = ${N(d)}`)}`,`And ${M(`${N(fb)} − ${pn(fa)} = ${N(d)}`)}, so the answer matches.`]}};

const CTX=[
  {nm:'T',x:'h',what:'the temperature, in °F,',when:'hours after noon',base:'°F',per:'hour',lo:10,hi:95,steps:[1,2]},
  {nm:'D',x:'t',what:'the distance, in miles, driven',when:'hours into a trip',base:'miles',per:'hour',lo:0,hi:400,steps:[1,2]},
  {nm:'W',x:'t',what:'the water, in liters, left in a tank',when:'minutes after it starts draining',base:'liters',per:'minute',lo:0,hi:200,steps:[1,2,5]},
  {nm:'H',x:'w',what:'the height of a plant, in cm,',when:'weeks after planting',base:'cm',per:'week',lo:2,hi:80,steps:[1,2]},
  {nm:'P',x:'y',what:'the population of a town, in thousands,',when:'years after 2000',base:'thousand people',per:'year',lo:5,hi:90,steps:[2,5]}
];

function genAroc(L){
  if(L===1){
    if(Math.random()<.5){ // plain table
      const st=pick([1,1,2,3]),x0=pick([-3,-2,-1,0,1,2]),xs=range(0,5).map(k=>x0+k*st);
      let ys,i,j;do{const v0=R(-6,8);ys=[v0];for(let k=1;k<6;k++)ys.push(ys[k-1]+nz(-6,6));i=R(0,3);j=R(i+2,5)}while(ys[j]===ys[i]);
      const a=xs[i],b=xs[j],fa=ys[i],fb=ys[j],d=fb-fa,len=b-a,nm=pick(['f','g','h']);
      return num(d/len,{prompt:`Find the average rate of change of ${F(nm)} on the interval ${M(ival(a,b))}.`,
        table:tbl([[X,...xs],[`${F(nm)}(${X})`,...ys]]),way:'Read two outputs, then subtract',whyNum:wrongNums(a,b,fa,fb,nm),
        alts:[checkAlt(a,b,fa,fb)],
        hints:[`Read the table: ${M(`${F(nm)}(${N(a)}) = ${N(fa)}`)} and ${M(`${F(nm)}(${N(b)}) = ${N(fb)}`)}.`,
          ...formulaSteps(nm,a,b,fa,fb)]});
    }
    // context table with units
    const c=pick(CTX),st=pick(c.steps),xs=range(0,5).map(k=>k*st);let ys,i,j;
    do{ys=[R(c.lo,c.hi)];for(let k=1;k<6;k++)ys.push(ys[k-1]+nz(-12,12));i=R(0,3);j=R(i+2,5)}while(ys.some(v=>v<c.lo||v>c.hi)||ys[j]===ys[i]);
    const a=xs[i],b=xs[j],fa=ys[i],fb=ys[j],d=fb-fa,len=b-a,unit=`${c.base} per ${c.per}`;
    const base={prompt:`The table gives ${c.what} ${c.x} ${c.when}. Find the average rate of change of ${F(c.nm)} from ${F(c.x)} = ${a} to ${F(c.x)} = ${b}.`,
      table:tbl([[F(c.x),...xs],[`${F(c.nm)}(${F(c.x)})`,...ys]]),way:'Read two outputs, then subtract',
      hints:[`Read the table: ${M(`${F(c.nm)}(${a}) = ${N(fa)}`)} and ${M(`${F(c.nm)}(${b}) = ${N(fb)}`)}.`,
        ...formulaSteps(c.nm,a,b,fa,fb).slice(0,1),
        `${gcd(Math.abs(d),Math.abs(len))===1?'':'Simplify the fraction: '+M(fr(N(d),N(len))+' = '+fh(d,len))+'. '}With units, the answer is ${M(fh(d,len))} ${unit}.`]};
    if(Math.random()<.5)return num(d/len,Object.assign(base,{prompt:base.prompt+` Give the number only; the units are ${unit}.`,whyNum:wrongNums(a,b,fa,fb,c.nm),alts:[checkAlt(a,b,fa,fb)]}));
    const ok=`${fh(d,len)} ${unit}`;
    return Object.assign(mcw(ok,[
      [`${fh(-d,len)} ${unit}`,`The sign is off. Subtract the later output minus the earlier one: ${N(fb)} − ${pn(fa)} = ${N(d)}, so the rate is ${fh(d,len)}.`],
      [`${fh(len,d)} ${unit}`,`You flipped the fraction. Change in output goes on top: ${fh(d,len)}.`],
      [`${N(d)} ${c.base}`,`That is the total change, not a rate. Divide by the ${len} ${c.per}s and say "per ${c.per}": ${fh(d,len)} ${unit}.`],
      [`${fh(d,len)} ${c.base}`,`The number is right but a rate needs "per": ${unit}.`]]),base);
  }
  if(L===2){
    const t=pick(['cubic','rational','quad','quad','graph']);
    if(t==='graph'){
      const w=walk();let i,j;do{i=R(0,6);j=R(i+2,8)}while(w[i]===w[j]);
      const a=i-4,b=j-4,fa=w[i],fb=w[j],d=fb-fa,len=b-a;
      return num(d/len,{prompt:`Use the graph to find the average rate of change of ${F('f')} on the interval ${M(ival(a,b))}.`,
        graph:svgGraph({segs:[{pts:w.map((y,k)=>[k-4,y]),cls:'f',ends:['closed','closed'],label:'f',labelAt:[-4.6,w[0]+.6]}],label:'Graph of f'}),
        whyNum:wrongNums(a,b,fa,fb,'f'),alts:[checkAlt(a,b,fa,fb)],way:'Read two points, then subtract',
        hints:[`Find ${X} = ${N(a)} on the graph and read up to the curve: ${M(`${F('f')}(${N(a)}) = ${N(fa)}`)}. Do the same at ${X} = ${N(b)}: ${M(`${F('f')}(${N(b)}) = ${N(fb)}`)}.`,
          ...formulaSteps('f',a,b,fa,fb)]});
    }
    let a,b,fa,fb,nm,defn,evalA,evalB,alts=[];
    if(t==='cubic'){const c=nz(-6,6);nm=pick(['f','g']);a=R(-3,1);b=a+R(2,4);const ev=x=>x*x*x+c*x;fa=ev(a);fb=ev(b);
      defn=`${X}<sup>3</sup>${c<0?' − ':' + '}${Math.abs(c)===1?'':Math.abs(c)}${X}`;
      const line=x=>`${F(nm)}(${N(x)}) = ${pn(x)}<sup>3</sup> ${c<0?'−':'+'} ${Math.abs(c)===1?'':Math.abs(c)}(${N(x)}) = ${N(x*x*x)} ${c*x<0?'−':'+'} ${Math.abs(c*x)} = ${N(ev(x))}`;
      evalA=line(a);evalB=line(b);}
    else if(t==='rational'){const k=pick([12,24,-12,-24,6,-6,-8,8]),ds=[1,2,3,4,6,8,12,24].filter(v=>k%v===0&&v<=12);nm='h';
      let u,v;do{u=pick(ds);v=pick(ds)}while(u>=v);const d=R(-3,3);a=u-d;b=v-d;const ev=x=>k/(x+d);fa=ev(a);fb=ev(b);
      defn=fr(N(k),pf([d,1]));
      const line=x=>`${F(nm)}(${N(x)}) = ${fr(N(k),`${N(x)}${tail(d)}`)}${d?` = ${fr(N(k),N(x+d))}`:''} = ${N(ev(x))}`;
      evalA=line(a);evalB=line(b);}
    else{const q2=pick([1,2,3,-1,-2,-3]),q1=nz(-6,6),q0=R(-5,5);nm=pick(['f','g','h']);a=R(-3,1);b=a+R(2,4);const ev=x=>q2*x*x+q1*x+q0;fa=ev(a);fb=ev(b);
      defn=pf([q0,q1,q2]);
      const line=x=>`${F(nm)}(${N(x)}) = ${sub([q0,q1,q2],N(x))} = ${N(ev(x))}`;evalA=line(a);evalB=line(b);
      alts=[{name:'Shortcut for quadratics',steps:[`For ${M(pf([q0,q1,q2]))}, the ${q0===0?'constant is 0 and it':'constant'} cancels when you subtract. The AROC on ${M('['+F('p')+', '+F('q')+']')} is ${M(`${F('a')}(${F('p')} + ${F('q')}) + ${F('b')}`)}, where ${F('a')} = ${N(q2)} and ${F('b')} = ${N(q1)}.`,
        `Here ${M(`${F('p')} + ${F('q')} = ${N(a)} + ${pn(b)} = ${N(a+b)}`)}.`,`${M(`${N(q2)}(${N(a+b)}) ${q1<0?'−':'+'} ${Math.abs(q1)} = ${N(q2*(a+b)+q1)}`)}, which matches ${M(fh(fb-fa,b-a))}.`]}];}
    const d=fb-fa,len=b-a;
    return num(d/len,{prompt:`Find the average rate of change of ${F(nm)} on the interval ${M(ival(a,b))}.`,math:`${F(nm)}(${X}) = ${defn}`,
      way:'Find both outputs, then subtract',whyNum:wrongNums(a,b,fa,fb,nm),alts:[...alts,checkAlt(a,b,fa,fb)],
      hints:[`Find the outputs first. ${M(evalA)}`,`And ${M(evalB)}`,...formulaSteps(nm,a,b,fa,fb)]});
  }
  // Level 3
  if(Math.random()<.6){ // composite from a table
    const xs=range(0,5);let g,f,a,b;
    do{g=shuffle(range(0,5));f=shuffle(range(-5,11)).slice(0,6);if(Math.random()<.6){a=0;b=3}else{a=R(0,3);b=R(a+2,5)}}while(f[g[a]]===f[g[b]]);
    const ga=g[a],gb=g[b],fa=f[ga],fb=f[gb],d=fb-fa,len=b-a,h=xs.map(x=>f[g[x]]);
    const wn=[];const add=(v,why)=>{if(Number.isFinite(v)&&Math.abs(v-d/len)>1e-9&&!wn.some(p=>Math.abs(p[0]-v)<1e-9))wn.push([v,why])};
    add((gb-ga)/len,`That is the average rate of change of ${F('g')} alone: ${M(fr(N(gb)+' − '+pn(ga),N(len)))}. The question asks about ${M(F('h')+' = '+F('f')+'('+F('g')+'('+X+'))')}, so run each ${X} through ${F('g')} and then ${F('f')}.`);
    add((f[b]-f[a])/len,`You used ${F('f')}(${b}) − ${F('f')}(${a}) directly. Those are ${F('f')} at the inputs ${b} and ${a}, but ${F('h')}(${b}) means ${F('f')}(${F('g')}(${b})) = ${F('f')}(${gb}).`);
    if(f[a]>=0&&f[a]<=5&&f[b]>=0&&f[b]<=5)add((g[f[b]]-g[f[a]])/len,`You did ${F('g')}(${F('f')}(${X})), which is the wrong order. ${F('f')}(${F('g')}(${X})) means ${F('g')} goes first.`);
    add(d,`That is the change in ${F('h')}, ${N(d)}. Divide by the change in ${X}, ${N(len)}.`);
    add(len/d,`You flipped the fraction. Change in output goes on top: ${M(fr(N(d),N(len)))}.`);
    return num(d/len,{prompt:`The table gives values of the functions ${F('f')} and ${F('g')}. Let ${F('h')}(${X}) = ${F('f')}(${F('g')}(${X})). Find the average rate of change of ${F('h')} on the interval ${M(ival(a,b))}.`,
      table:tbl([[X,...xs],[`${F('g')}(${X})`,...g],[`${F('f')}(${X})`,...f]]),way:'Inside out at each end',whyNum:wn,
      alts:[{name:'Build the h row first',steps:[`Fill in ${F('h')}(${X}) = ${F('f')}(${F('g')}(${X})) for every ${X}: ${M(h.map((v,x)=>`${F('h')}(${x}) = ${N(v)}`).join(', '))}`,`Then read the two ends: ${M(`${F('h')}(${a}) = ${N(fa)}`)} and ${M(`${F('h')}(${b}) = ${N(fb)}`)}.`,`${M(fr(`${N(fb)} − ${pn(fa)}`,`${b} − ${a}`)+' = '+fh(d,len))}`]},checkAlt(a,b,fa,fb)],
      hints:[`${F('h')}(${a}) = ${F('f')}(${F('g')}(${a})). Inside first: ${F('g')}(${a}) = ${N(ga)}. Then ${F('f')}(${N(ga)}) = ${N(fa)}. So ${M(`${F('h')}(${a}) = ${N(fa)}`)}.`,
        `${F('h')}(${b}) = ${F('f')}(${F('g')}(${b})). Inside first: ${F('g')}(${b}) = ${N(gb)}. Then ${F('f')}(${N(gb)}) = ${N(fb)}. So ${M(`${F('h')}(${b}) = ${N(fb)}`)}.`,
        ...formulaSteps('h',a,b,fa,fb)]});
  }
  // weighted average challenge
  let l1,l2,m1,m2;do{l1=R(2,4);l2=R(2,5);m1=nz(-4,6);m2=nz(-4,6)}while(l1===l2||m1===m2);
  const s=R(-2,1),mid=s+l1,e=mid+l2,tot=m1*l1+m2*l2,len=l1+l2;
  return num(tot/len,{prompt:`${F('f')} has an average rate of change of ${N(m1)} on ${M(ival(s,mid))} and an average rate of change of ${N(m2)} on ${M(ival(mid,e))}. What is the average rate of change of ${F('f')} on ${M(ival(s,e))}?`,
    way:'Add up the total change',
    whyNum:[[(m1+m2)/2,`You averaged the two rates, ${M(fr(N(m1)+' + '+pn(m2),2))}. The intervals have different lengths (${l1} and ${l2}), so the longer one counts more. Add the total changes instead.`],
      [tot,`${N(tot)} is the total change in ${F('f')}. Divide it by the length of the whole interval, ${len}.`]],
    alts:[{name:'Weighted average of the rates',steps:[`Weight each rate by its interval length: ${M(fr(`${l1}(${N(m1)}) + ${l2}(${N(m2)})`,`${l1} + ${l2}`))}`,`${M(fh(tot,len))}. It is the same calculation as the main way.`]}],
    hints:[`Rate × length = change. On ${M(ival(s,mid))} the length is ${l1}, so ${F('f')} changes by ${M(`${N(m1)} · ${l1} = ${N(m1*l1)}`)}.`,
      `On ${M(ival(mid,e))} the length is ${l2}, so ${F('f')} changes by ${M(`${N(m2)} · ${l2} = ${N(m2*l2)}`)}.`,
      `Total change: ${M(`${N(m1*l1)} + ${pn(m2*l2)} = ${N(tot)}`)}. Total length: ${M(`${l1} + ${l2} = ${len}`)}.`,
      `AROC on the whole interval: ${M(fr(N(tot),len))}${gcd(Math.abs(tot),Math.abs(len))===1?'':' = '+M(fh(tot,len))}.`]});
}

TOPICS.push({id:'aroc',name:'Average rate of change',tip:`AROC on [${F('a')}, ${F('b')}] = ${M(fr(`${F('f')}(${F('b')}) − ${F('f')}(${F('a')})`,`${F('b')} − ${F('a')}`))}. Find the two outputs first, then subtract in the same order. Keep it as a fraction and add units.`,gen:genAroc});
})();

// ---- 05-lines.js
// Topic: Equations of lines  (Honors Algebra 2, Test #2)
(()=>{
/* ---------- helpers ---------- */
const rd=(p,q)=>{const g=gcd(p,q)||1;p/=g;q/=g;if(q<0){p=-p;q=-q}return[p,q]};
const fs=(p,q)=>{const {neg,t}=fq(p,q);return(neg?'−':'')+t};                 // fraction p/q as html
const pt=(x,y)=>`(${N(x)}, ${N(y)})`;
const sub=(v,c)=>c===0?v:`${v} ${c>0?'−':'+'} ${Math.abs(c)}`;                // v − c, with a real sign
const slopeCo=(p,q)=>q===1?co(p):fs(p,q);
const psf=(p,q,x1,y1)=>`${sub(Y,y1)} = ${slopeCo(p,q)}(${sub(X,x1)})`;        // point-slope form
const si=(p,q,bn,bd=1)=>Y+' = '+lcf([[p,q,X],[bn,bd,'']]);                    // y = (p/q)x + bn/bd
const norm=(A,B,C)=>{const g=gcd(gcd(A,B),C)||1;A/=g;B/=g;C/=g;if(A<0||(A===0&&B<0)){A=-A;B=-B;C=-C}return[A,B,C]};
const raw=(A,B,C)=>B===0?`${X} = ${fs(C,A)}`:A===0?`${Y} = ${fs(C,B)}`:`${lc([[A,X],[B,Y]])} = ${N(C)}`;
const S=(A,B,C)=>raw(...norm(A,B,C));                                         // standard form, A > 0
const Sneg=(A,B,C)=>{[A,B,C]=norm(A,B,C);return raw(-A,-B,-C)};               // same line, A < 0 (the trap)
const dupe=(a,b,p,q)=>fs(a,b)===fs(p,q)?fs(p,q):fs(a,b)+' = '+fs(p,q);
const rslope=()=>{let p,q;do{q=pick([1,1,2,3,4,5]);p=nz(-6,6)}while(gcd(p,q)!==1);return[p,q]};

/* point-slope route to standard form, as hint steps. slope p/q (q>0), point (x1,y1) */
function stdHints(p,q,x1,y1,first){
  const A=-p,B=q,C=q*y1-p*x1,[a,b,c]=norm(A,B,C),h=[];
  h.push((first?first+' ':'')+`Use point-slope form ${M('y − y₁ = m(x − x₁)')} with the point ${pt(x1,y1)} and slope ${M(fs(p,q))}: ${M(psf(p,q,x1,y1))}`);
  h.push((q>1?`Multiply both sides by ${q} to clear the fraction: ${M(`${q}(${sub(Y,y1)}) = ${N(p)}(${sub(X,x1)})`)}. Then distribute`:`Distribute`)+` and get the ${X}- and ${Y}-terms on the left: ${M(raw(A,B,C))}`);
  const fix=(a!==A||b!==B||c!==C);
  h.push(fix?`${A<0?'Multiply by −1 so A is positive':'Divide by the common factor'}${A<0&&gcd(gcd(-A,B),C)>1?' and divide by the common factor':''}: ${M(raw(a,b,c))}. This is the answer.`:`A is already positive and there is no common factor, so the answer is ${M(raw(a,b,c))}.`);
  return h;
}
/* slope-intercept route to standard form, as an alt */
function stdAlt(p,q,x1,y1){
  const bn=q*y1-p*x1,[a,b,c]=norm(-p,q,bn),k=fq(bn,q);
  const steps=[`Use ${M('y = mx + b')} with ${M('m = '+fs(p,q))}. Plug in ${pt(x1,y1)}: ${M(N(y1)+' = '+slopeCo(p,q)+'('+N(x1)+') + b')}, so ${M('b = '+fs(bn,q))}.`,
    `So ${M(si(p,q,bn,q))}.`,
    `Clear fractions, get ${X} and ${Y} on the left, make A positive: ${M(raw(a,b,c))}.`,
    `Check by plugging in: ${M(`${N(a)}(${N(x1)}) ${sgn(b)} ${Math.abs(b)}(${N(y1)}) = ${N(a*x1+b*y1)}`)}, which equals ${M(N(c))}.`];
  return{name:'Slope-intercept first',steps};
}
const chk=(a,b,c,pts)=>({name:'Check by plugging in a point',steps:pts.map(([x,y])=>`Plug ${pt(x,y)} into ${M(raw(a,b,c))}: ${M(`${N(a)}(${N(x)}) ${sgn(b)} ${Math.abs(b)}(${N(y)}) = ${N(a*x+b*y)}`)}, and ${M(N(c))} on the right matches.`)});

/* ---------- Level 1 ---------- */
function l1(){
  const t=pick(['si','si','hv','ps','yint']);
  if(t==='si'){
    let p,q,x1,y1,k,b;
    do{[p,q]=rslope();k=R(-4,4);x1=q*k;y1=R(-8,8);b=y1-p*k}while(x1===0||b===0||b===y1||y1===0);
    const ans=si(p,q,b),m=fs(p,q);
    return Object.assign(mcw(ans,[
      [si(p,q,y1+p*k),`You added ${M(m+'('+N(x1)+') = '+N(p*k))} to ${N(y1)} instead of subtracting it. Since ${M('b = y − mx')}, subtract: ${N(y1)} − (${N(p*k)}) = ${N(b)}.`],
      [si(p,q,-b),`The intercept has the wrong sign. ${N(y1)} − (${N(p*k)}) = ${N(b)}, not ${N(-b)}.`],
      [si(p,q,y1),`${N(y1)} is the y-value when x = ${N(x1)}, not when x = 0. The y-intercept ${F('b')} still has to be found: ${N(b)}.`],
      [si(-p,q,y1+p*k),`That line has slope ${M(fs(-p,q))}. The problem gives slope ${M(m)}, so keep its sign.`]]),
      {prompt:`Write the equation of the line through ${pt(x1,y1)} with slope ${M(m)} in slope-intercept form.`,way:'Point-slope first',
      hints:[`Start with point-slope form: ${M(psf(p,q,x1,y1))}`,`Distribute the slope: ${M(sub(Y,y1)+' = '+lcf([[p,q,X],[-p*k,1,'']]))}`,`Move the ${N(-y1)===N(0)?'':'constant'} to the right side by ${y1>0?'adding':'subtracting'} ${Math.abs(y1)}: ${M(ans)}`],
      alts:[{name:'Find b with y = mx + b',steps:[`Plug the point into ${M('y = mx + b')}: ${M(N(y1)+' = '+slopeCo(p,q)+'('+N(x1)+') + b')}`,`The product is ${N(p*k)}, so ${M(N(y1)+' = '+N(p*k)+' + b')} and ${M('b = '+N(b))}.`,`Write it out: ${M(ans)}`,`Check: when x = ${N(x1)}, y = ${N(p*k)} ${sgn(b)} ${Math.abs(b)} = ${N(y1)}. Matches the point.`]}]});
  }
  if(t==='hv'){
    let x1,y1;do{x1=nz(-8,8);y1=nz(-8,8)}while(Math.abs(x1)===Math.abs(y1));
    const horiz=Math.random()<.5,how=horiz?pick(['the horizontal line','the line with slope 0']):pick(['the vertical line','the line whose slope is undefined']);
    const xe=c=>`${X} = ${N(c)}`,ye=c=>`${Y} = ${N(c)}`;
    const ans=horiz?ye(y1):xe(x1);
    const same=horiz?'y-value':'x-value';
    return Object.assign(mcw(ans,horiz?[
      [xe(x1),`${X} = ${N(x1)} is a vertical line. A horizontal line keeps the same ${Y}, so use ${N(y1)}: ${ye(y1)}.`],
      [ye(x1),`You used the ${X}-coordinate. A horizontal line is ${Y} = (the point’s ${Y}-value) = ${N(y1)}.`],
      [xe(y1),`You swapped the coordinates and also got a vertical line. A horizontal line through ${pt(x1,y1)} is ${ye(y1)}.`]
    ]:[
      [ye(y1),`${Y} = ${N(y1)} is a horizontal line. A vertical line keeps the same ${X}, so use ${N(x1)}: ${xe(x1)}.`],
      [xe(y1),`You used the ${Y}-coordinate. A vertical line is ${X} = (the point’s ${X}-value) = ${N(x1)}.`],
      [ye(x1),`You swapped the coordinates and also got a horizontal line. A vertical line through ${pt(x1,y1)} is ${xe(x1)}.`]]),
      {prompt:`Write the equation of ${how} through ${pt(x1,y1)}.`,way:'Same coordinate everywhere',
      hints:horiz?[`A horizontal line has slope 0, and every point on it has the same ${Y}-value.`,`The point ${pt(x1,y1)} has ${Y} = ${N(y1)}, so every point on the line has ${Y} = ${N(y1)}.`,`The equation is ${M(ye(y1))}.`]
        :[`A vertical line’s slope is undefined, and every point on it has the same ${X}-value.`,`The point ${pt(x1,y1)} has ${X} = ${N(x1)}, so every point on the line has ${X} = ${N(x1)}.`,`The equation is ${M(xe(x1))}.`],
      alts:[{name:'Picture it',steps:[`Plot ${pt(x1,y1)}. ${horiz?`Draw a flat line through it. It crosses the ${Y}-axis at ${N(y1)} and never touches the ${X}-axis (unless ${Y} = 0).`:`Draw a straight up-and-down line through it. It crosses the ${X}-axis at ${N(x1)}.`}`,`So the ${same} never changes: ${M(horiz?ye(y1):xe(x1))}.`]}]});
  }
  if(t==='ps'){
    let p,q,x1,y1;do{[p,q]=rslope();x1=nz(-7,7);y1=nz(-7,7)}while(x1===y1);
    const mk=(a,b,m=[p,q])=>`${sub(Y,a)} = ${slopeCo(m[0],m[1])}(${sub(X,b)})`;
    const ans=mk(y1,x1);
    return Object.assign(mcw(ans,[
      [mk(-y1,x1),`The ${Y}-side has the wrong sign. The point is ${pt(x1,y1)}, so it is ${M('y − ('+N(y1)+')')} = ${M(sub(Y,y1))}.`],
      [mk(y1,-x1),`The ${X}-side has the wrong sign. ${M('x − ('+N(x1)+')')} = ${M(sub(X,x1))}.`],
      [mk(-y1,-x1),`Both signs are flipped. Point-slope is ${M('y − y₁ = m(x − x₁)')}, so you subtract each coordinate. Subtracting ${N(y1)} gives ${M(sub(Y,y1))}, and subtracting ${N(x1)} gives ${M(sub(X,x1))}.`],
      [mk(x1,y1),`You put the ${X}-coordinate with ${Y}. ${Y} goes with ${N(y1)} and ${X} goes with ${N(x1)}.`]]),
      {prompt:`Which is the point-slope form of the line through ${pt(x1,y1)} with slope ${M(fs(p,q))}?`,way:'Subtract the point',
      hints:[`Point-slope form is ${M('y − y₁ = m(x − x₁)')}.`,`Here ${M('x₁ = '+N(x1))}, ${M('y₁ = '+N(y1))}, ${M('m = '+fs(p,q))}.`,`Subtracting a negative number turns into adding: ${M(ans)}`]});
  }
  let m,x1,y1;do{m=nz(-6,6);x1=nz(-6,6);y1=R(-9,9)}while(y1-m*x1===0);
  const b=y1-m*x1;

    hints:[`Use ${M('y = mx + b')} with ${M('m = '+N(m))} and the point ${pt(x1,y1)}: ${M(N(y1)+' = '+N(m)+'('+N(x1)+') + b')}`,`${M(N(m)+'('+N(x1)+') = '+N(m*x1))}, so ${M(N(y1)+' = '+N(m*x1)+' + b')}`,`Solve for ${F('b')}: ${M('b = '+N(y1)+' − ('+N(m*x1)+') = '+N(b))}`],

}

/* ---------- Level 2 ---------- */
function twoPoints(needIntB){
  let x1,y1,x2,y2,p,q,tries=0;
  do{x1=R(-6,6);y1=R(-7,7);x2=R(-6,6);y2=R(-7,7);[p,q]=rd(y2-y1,x2-x1);tries++}
  while(x1===x2||y1===y2||Math.abs(p)===q||Math.abs(x1)+Math.abs(x2)<2||(needIntB&&tries<300&&(q*y1-p*x1)%q!==0));
  return{x1,y1,x2,y2,p,q};
}
function l2(){
  const t=pick(['twosi','twostd','twostd','parstd','conv']);
  if(t==='twosi'){
    const {x1,y1,x2,y2,p,q}=twoPoints(true),bn=q*y1-p*x1,[bp,bq]=rd(bn,q);
    const ans=si(p,q,bn,q);
    const [fp,fq2]=rd(q,p), [np,nq]=rd(-p,q);
    return Object.assign(mcw(ans,[
      [si(fp,fq2,q*y1-fp*x1,q),`You flipped the slope to run/rise. Slope is rise over run: ${M(`(${N(y2)} − ${y1<0?'('+N(y1)+')':y1})/(${N(x2)} − ${x1<0?'('+N(x1)+')':x1}) = ${fs(p,q)}`)}.`],
      [si(np,nq,y1*nq-np*x1,nq),`The slope has the wrong sign. Subtract in the same order top and bottom: ${M(fs(y2-y1,x2-x1)+' = '+fs(p,q))}.`],
      [si(p,q,q*y1+p*x1,q),`The slope is right, but the intercept is off. ${F('b')} = ${F('y')} − ${F('m')}${F('x')} = ${N(y1)} − (${fs(p*x1,q)}) = ${fs(bn,q)}, not ${fs(q*y1+p*x1,q)}.`],
      [si(p,q,-bn,q),`The slope is right, but the intercept has the wrong sign. ${F('b')} = ${fs(bn,q)}.`]]),
      {prompt:`Write the equation of the line through ${pt(x1,y1)} and ${pt(x2,y2)} in slope-intercept form.`,way:'Slope, then point-slope',
      hints:[`Find the slope: ${M(`m = (${N(y2)} − ${y1<0?'('+N(y1)+')':y1})/(${N(x2)} − ${x1<0?'('+N(x1)+')':x1}) = ${dupe(y2-y1,x2-x1,p,q)}`)}`,`Use point-slope with ${pt(x1,y1)}: ${M(psf(p,q,x1,y1))}`,`Distribute and solve for ${Y}: ${M(ans)}`],
      alts:[{name:'Use y = mx + b',steps:[`Slope: ${M('m = '+fs(p,q))}. Plug ${pt(x1,y1)} into ${M('y = mx + b')}: ${M(N(y1)+' = '+slopeCo(p,q)+'('+N(x1)+') + b')}`,`Solve: ${M('b = '+fs(bn,q))}, so ${M(ans)}`,`Check the other point: ${M(`${fs(p*x2,q)} ${sgn(bn)} ${fs(Math.abs(bn),q)} = ${fs(p*x2+bn,q)}`)} should be ${N(y2)}.`]}]});
  }
  if(t==='twostd'){
    const {x1,y1,x2,y2,p,q}=twoPoints(false),A=-p,B=q,C=q*y1-p*x1,[a,b,c]=norm(A,B,C);
    return Object.assign(mcw(S(A,B,C),[
      [Sneg(A,B,C),`That equals the right line, but standard form needs A > 0. Multiply both sides by −1: ${M(S(A,B,C))}.`],
      [S(A,B,-C),`The constant has the wrong sign. Plug in ${pt(x1,y1)}: ${N(a)}(${N(x1)}) ${sgn(b)} ${Math.abs(b)}(${N(y1)}) = ${N(a*x1+b*y1)}, so C = ${N(c)}.`],
      [S(p,q,p*x1+q*y1),`That line has slope ${M(fs(-p,q))}, the opposite sign. The slope of ${M('Ax + By = C')} is −A/B, so with slope ${M(fs(p,q))} you need ${M(lc([[a,X],[b,Y]]))}.`],
      [S(q,-p,q*x1-p*y1),`You swapped the coefficients (used run/rise). The slope is rise/run = ${M(fs(p,q))}, so A = ${N(-p)} before making it positive.`]]),
      {prompt:`Write the equation of the line through ${pt(x1,y1)} and ${pt(x2,y2)} in standard form (integers, A > 0).`,way:'Point-slope, then clear fractions',
      hints:[`Find the slope: ${M(`m = (${N(y2)} − ${y1<0?'('+N(y1)+')':y1})/(${N(x2)} − ${x1<0?'('+N(x1)+')':x1}) = ${fs(p,q)}`)}`,...stdHints(p,q,x1,y1)],
      alts:[stdAlt(p,q,x1,y1),chk(a,b,c,[[x1,y1],[x2,y2]])]});
  }
  if(t==='parstd'){
    let p,q,c0,x1,y1;
    do{[p,q]=rslope();c0=nz(-8,8);x1=R(-7,7);y1=R(-7,7)}while(y1*q===p*x1+c0*q||x1===0);
    const A=-p,B=q,C=q*y1-p*x1,[a,b,c]=norm(A,B,C);
    return Object.assign(mcw(S(A,B,C),[
      [Sneg(A,B,C),`That is the same line, but standard form needs A > 0. Multiply by −1: ${M(S(A,B,C))}.`],
      [S(A,B,-C),`The constant has the wrong sign. Plug in ${pt(x1,y1)}: ${N(a)}(${N(x1)}) ${sgn(b)} ${Math.abs(b)}(${N(y1)}) = ${N(a*x1+b*y1)}.`],
      [S(q,p,q*x1+p*y1),`You used the perpendicular slope. Parallel lines keep the same slope, ${M(fs(p,q))}.`],
      [S(A,B,q*c0),`That is the original line. Parallel means the same slope, but it must pass through ${pt(x1,y1)}, so C changes to ${N(c)}.`],
      [S(-p,1,y1-p*x1),`You dropped the denominator and used slope ${N(p)} instead of ${M(fs(p,q))}. Keep the whole fraction.`]]),
      {prompt:`Write the equation of the line parallel to ${M(si(p,q,c0))} through ${pt(x1,y1)} in standard form.`,way:'Same slope, new point',
      hints:[`Parallel lines have equal slopes, so ${M('m = '+fs(p,q))}.`,...stdHints(p,q,x1,y1)],
      alts:[stdAlt(p,q,x1,y1),chk(a,b,c,[[x1,y1]])]});
  }
  // conv: slope-intercept with fractions -> standard form
  let p,q,bn,bd;

    alts:[{name:'Check with a point',steps:[`Pick ${X} = ${N(bd*q)}: the original gives ${Y} = ${fs(p*bd,1)} ${sgn(bn)} ${fs(Math.abs(bn)*q,bd*q)}`.replace(/ \+ 0| − 0/,'')+`. Plug that point into ${M(raw(a,b,c))} to confirm both equations agree.`]}]});
}

/* ---------- Level 3 ---------- */
function l3(){
  const t=pick(['perpstd','perphv','bisect','perpgiven','findk','perpstd','bisect']);
  if(t==='perpstd'){
    let p,q,c0,x1,y1;
    do{[p,q]=rslope();c0=nz(-6,6);x1=R(-6,6);y1=R(-6,6)}while(x1===0&&y1===0);
    const [pp,pq]=rd(-q,p),A=q,B=p,C=q*x1+p*y1,[a,b,c]=norm(A,B,C);
    return Object.assign(mcw(S(A,B,C),[
      [S(-p,q,q*y1-p*x1),`That is the parallel line (same slope ${M(fs(p,q))}). Perpendicular needs the negative reciprocal, ${M(fs(pp,pq))}.`],
      [S(-q,p,p*y1-q*x1),`You flipped the slope but forgot the negative sign, so you got ${M(fs(q,p))}. Perpendicular slope is the negative reciprocal: ${M(fs(pp,pq))}.`],
      [S(p,q,p*x1+q*y1),`You changed the sign but didn’t flip the fraction, so you got ${M(fs(-p,q))}. The negative reciprocal of ${M(fs(p,q))} is ${M(fs(pp,pq))}.`],
      [S(A,B,-C),`The constant has the wrong sign. Plug in ${pt(x1,y1)}: ${N(a)}(${N(x1)}) ${sgn(b)} ${Math.abs(b)}(${N(y1)}) = ${N(a*x1+b*y1)}.`],
      [Sneg(A,B,C),`That is the same line, but standard form needs A > 0. Multiply by −1: ${M(S(A,B,C))}.`]]),
      {prompt:`Write the equation of the line perpendicular to ${M(si(p,q,c0))} through ${pt(x1,y1)} in standard form.`,way:'Negative reciprocal slope',
      hints:stdHints(pp,pq,x1,y1,`The given slope is ${M(fs(p,q))}. Perpendicular slope is the negative reciprocal (flip it and change the sign): ${M(fs(pp,pq))}.`),
      alts:[stdAlt(pp,pq,x1,y1),chk(a,b,c,[[x1,y1]])]});
  }
  if(t==='perphv'){
    let c,x1,y1;do{c=nz(-8,8);x1=nz(-8,8);y1=nz(-8,8)}while(new Set([c,x1,y1]).size<3);
    const horizGiven=Math.random()<.5,xe=v=>`${X} = ${N(v)}`,ye=v=>`${Y} = ${N(v)}`;
    if(horizGiven)return Object.assign(mcw(xe(x1),[
      [ye(y1),`That is a horizontal line, parallel to ${ye(c)}. A perpendicular line is vertical: ${xe(x1)}.`],
      [xe(c),`The number ${N(c)} belongs to the given line. The new line must pass through ${pt(x1,y1)}, so it is ${xe(x1)}.`],
      [ye(c),`That is the original line itself. A line perpendicular to a horizontal line is vertical, through ${X} = ${N(x1)}.`],
      [xe(y1),`You used the ${Y}-coordinate. A vertical line takes the ${X}-value of the point: ${xe(x1)}.`]]),
      {prompt:`Write the equation of the line perpendicular to ${M(ye(c))} through ${pt(x1,y1)}.`,way:'Horizontal ⟂ vertical',
      hints:[`${M(ye(c))} is horizontal (slope 0). A line perpendicular to a horizontal line is vertical.`,`A vertical line has the same ${X}-value everywhere. The point ${pt(x1,y1)} has ${X} = ${N(x1)}.`,`The equation is ${M(xe(x1))}.`]});
    return Object.assign(mcw(ye(y1),[
      [xe(x1),`That is a vertical line, parallel to ${xe(c)}. A perpendicular line is horizontal: ${ye(y1)}.`],
      [ye(c),`The number ${N(c)} belongs to the given line. The new line must pass through ${pt(x1,y1)}, so it is ${ye(y1)}.`],
      [xe(c),`That is the original line itself. A line perpendicular to a vertical line is horizontal, through ${Y} = ${N(y1)}.`],
      [ye(x1),`You used the ${X}-coordinate. A horizontal line takes the ${Y}-value of the point: ${ye(y1)}.`]]),
      {prompt:`Write the equation of the line perpendicular to ${M(xe(c))} through ${pt(x1,y1)}.`,way:'Vertical ⟂ horizontal',
      hints:[`${M(xe(c))} is vertical (its slope is undefined). A line perpendicular to a vertical line is horizontal.`,`A horizontal line has the same ${Y}-value everywhere. The point ${pt(x1,y1)} has ${Y} = ${N(y1)}.`,`The equation is ${M(ye(y1))}.`]});
  }
  if(t==='bisect'){
    let x1,y1,a,b;do{x1=R(-7,7);y1=R(-7,7);a=nz(-5,5);b=nz(-5,5)}while(false);
    const x2=x1+2*a,y2=y1+2*b,mx=x1+a,my=y1+b,dx=2*a,dy=2*b,C=dx*mx+dy*my,[ma,mb,mc]=norm(dx,dy,C);
    const [sp,sq]=rd(dy,dx),[pp,pq]=rd(-dx,dy);
    return Object.assign(mcw(S(dx,dy,C),[
      [S(dx,dy,dx*x1+dy*y1),`That line is perpendicular to AB, but it goes through point A, not the midpoint. Use the midpoint ${pt(mx,my)}.`],

      [S(dy,dx,dy*mx+dx*my),`You changed the sign but didn’t flip the slope of AB, ${M(fs(sp,sq))}. The perpendicular slope is ${M(fs(pp,pq))}.`],
      [S(dx,dy,dx*(x1+x2)+dy*(y1+y2)),`The midpoint is the average, so divide the sums by 2: ${pt(mx,my)}, not ${pt(x1+x2,y1+y2)}.`],
      [Sneg(dx,dy,C),`That is the right line, but standard form needs A > 0. Multiply by −1: ${M(S(dx,dy,C))}.`]]),
      {prompt:`Find the perpendicular bisector of the segment with endpoints A${pt(x1,y1)} and B${pt(x2,y2)}. Write it in standard form.`,way:'Midpoint + perpendicular slope',
      hints:stdHints(pp,pq,mx,my,`The bisector passes through the midpoint: ${M(`((${N(x1)} + ${x2<0?'('+N(x2)+')':x2})/2, (${N(y1)} + ${y2<0?'('+N(y2)+')':y2})/2) = ${pt(mx,my)}`)}. Slope of AB: ${M(`(${N(y2)} − ${y1<0?'('+N(y1)+')':y1})/(${N(x2)} − ${x1<0?'('+N(x1)+')':x1}) = ${fs(sp,sq)}`)}. The bisector is perpendicular, so its slope is the negative reciprocal, ${M(fs(pp,pq))}.`),
      alts:[stdAlt(pp,pq,mx,my),chk(ma,mb,mc,[[mx,my]])]});
  }
  if(t==='perpgiven'){
    let A,B,C0,x1,y1;do{A=nz(-7,7);B=nz(-7,7);C0=nz(-12,12);x1=R(-5,5);y1=R(-5,5)}while(Math.abs(A)===Math.abs(B));
    const nA=B,nB=-A,nC=B*x1-A*y1,[a,b,c]=norm(nA,nB,nC);
    const [mp,mq]=rd(-A,B),[pp,pq]=rd(B,A);
    return Object.assign(mcw(S(nA,nB,nC),[
      [S(A,B,A*x1+B*y1),`That is the parallel line (same slope ${M(fs(mp,mq))}). Perpendicular needs the negative reciprocal, ${M(fs(pp,pq))}.`],

      [Sneg(nA,nB,nC),`That is the same line, but standard form needs A > 0. Multiply by −1.`]]),
      {prompt:`Write the equation of the line perpendicular to ${M(raw(A,B,C0))} through ${pt(x1,y1)} in standard form.`,way:'Slope from A and B',
      hints:stdHints(pp,pq,x1,y1,`Find the slope of the given line (slope of ${M('Ax + By = C')} is −A/B): ${M(`m = −(${N(A)})/(${N(B)}) = ${fs(mp,mq)}`)}. Perpendicular slope is the negative reciprocal: ${M(fs(pp,pq))}.`),

  return num(k,{prompt:`Find the value of ${F('k')} so that the line ${M(`${F('k')}${X} ${sgn(Bk)} ${Math.abs(Bk)}${Y} = ${N(c2)}`)} is parallel to ${M(raw(Ap,Bp,c1))}.`,way:'Set the slopes equal',
    hints:[`Slope of ${M('Ax + By = C')} is −A/B. The given line has ${M(`m = −(${N(Ap)})/(${N(Bp)}) = ${N(s)}`)}.`,`The other line has ${M(`m = −${F('k')}/(${N(Bk)})`)}. Parallel lines have equal slopes: ${M(`−${F('k')}/(${N(Bk)}) = ${N(s)}`)}`,`Multiply both sides by ${N(Bk)}: ${M(`−${F('k')} = ${N(s*Bk)}`)}, so ${M(F('k')+' = '+N(k))}.`],

    alts:[{name:'Check with the answer',steps:[`Put ${F('k')} = ${N(k)} in: ${M(`${N(k)}${X} ${sgn(Bk)} ${Math.abs(Bk)}${Y} = ${N(c2)}`)} has slope ${M(`−(${N(k)})/(${N(Bk)}) = ${N(s)}`)}, which equals the other slope ${N(s)}.`]}]});
}

function genLines(L){return L===1?l1():L===2?l2():l3()}

TOPICS.push({id:'lines',name:'Equations of lines',tip:`Get a slope and a point, then use point-slope ${M('y − y₁ = m(x − x₁)')}. For standard form, clear fractions and make A positive. Horizontal: ${M('y = c')}. Vertical: ${M('x = c')}.`,gen:genLines});

(()=>{

/* ---------- Level 1 ---------- */
function genL1(){
  const kind=pick(['count','eqGrow','shrinkEmpty','eqShrink','evalGrow']);
  if(kind==='count'||kind==='eqGrow'||kind==='evalGrow'){
    const c=pick(GROW);let m,b;do{m=R(2,9);b=5*R(1,12)}while(m===b);
    const intro=c.intro(b,m),eq=eqS(c.Q,c.v,m,b);
    if(kind==='count'){
      const n=R(3,16),S=m*n+b;
      return num(n,{prompt:`${intro} ${c.spent(S)} ${c.how}`,way:'Set up the equation, then solve',
        hints:[`The ${M('$'+b)} is charged once, so it is the starting value. The ${M('$'+m)} repeats, so it is the rate. Write the equation: ${M(eq)}`,
          `Put in the total: ${M(m+I(c.v)+' + '+b+' = '+S)}`,`Subtract ${b} from both sides: ${M(m+I(c.v)+' = '+(S-b))}`,`Divide both sides by ${m}: ${M(I(c.v)+' = '+n)}. The answer is ${n} ${c.pl}.`],
        alts:[{name:'Think it through in words',steps:[`Take away the one-time ${M('$'+b)}: ${M('$'+S+' − $'+b+' = $'+(S-b))} was spent on the repeating part.`,`Each one costs ${M('$'+m)}, so ${M('$'+(S-b)+' ÷ $'+m+' = '+n)}.`]},
          ck(`Put ${M(I(c.v)+' = '+n)} into ${M(eq)}.`,M(m+'('+n+') + '+b),S)],
        whyNum:[[S/m,`You divided the total by ${m} without taking off the ${M('$'+b)} first. The ${b} is charged once, so subtract it before dividing: (${S} − ${b}) ÷ ${m} = ${n}.`],
          [S-b,`${S-b} is the money spent on the repeating part. Divide by ${m} to find how many: ${n}.`],
          [(S+b)/m,`You added ${b} instead of subtracting it. The ${b} is already inside the ${S}, so take it out: ${S} − ${b}.`]]});
    }
    if(kind==='evalGrow'){
      const n=R(3,16),S=m*n+b;
      return num(S,{prompt:`${intro} ${c.evalQ(n)}`,way:'Write the equation and plug in',
        hints:[`Start with the fee, then add the rate times the amount: ${M(eq)}`,`Put in ${n}: ${M(I(c.Q)+' = '+m+'('+n+') + '+b)}`,`${M(m+'('+n+') = '+(m*n))}, so ${M(I(c.Q)+' = '+(m*n)+' + '+b+' = '+S)}. The answer is $${S}.`],
        whyNum:[[m*n,`You left out the ${M('$'+b)} that is charged once. Add it: ${m*n} + ${b} = ${S}.`],[(m+b)*n,`You added ${m} and ${b} and then multiplied by ${n}. The ${b} is charged only once: ${m}(${n}) + ${b} = ${S}.`]]});
    }
    const wr=[
      [I(`${c.Q} = ${b}${c.v} + ${m}`),`You swapped the fee and the rate. The ${b} is charged once (the constant), and ${m} multiplies ${I(c.v)}: ${m}${I(c.v)} + ${b}.`],
      [I(`${c.Q} = ${m}(${c.v} + ${b})`),`That multiplies the ${b} by ${m} too. The ${b} is charged only once, so it is added after: ${m}${I(c.v)} + ${b}.`],
      [I(`${c.Q} = ${m}${c.v} - ${b}`),`The ${b} is a fee added on, not taken away. Use + ${b}.`],
      [I(`${c.Q} = ${m+b}${c.v}`),`You added the two numbers into one rate. They play different roles: ${b} is the start, ${m} is the rate per ${c.pl.replace(/s$/,'')}.`]];
    return Object.assign(mcw(eq,shuffle(wr)),{prompt:`${intro} Which equation gives the ${c.what}?`,
      hints:[`The ${M('$'+b)} is charged one time, so it is the starting value (the constant).`,`The ${M('$'+m)} is charged again for every ${c.pl.replace(/s$/,'')}, so it multiplies ${M(I(c.v))}.`,`Put them together: ${M(eq)}`]});
  }
  const c=pick(SHRINK);const r=R(2,9),n=R(4,14),b=r*n;
  const intro=c.intro(b,r),eq=eqSub(c.Q,c.v,b,r);
  if(kind==='shrinkEmpty'){
    if(Math.random()<.5){
      return num(n,{prompt:`${intro} ${c.emptyQ}`,way:'Set the amount equal to 0',
        hints:[`You start with ${b} and lose ${r} each time. Write the equation: ${M(eq)}`,`Empty means the amount is 0: ${M('0 = '+b+' − '+r+I(c.v))}`,`Add ${r}${M(I(c.v))} to both sides: ${M(r+I(c.v)+' = '+b)}`,`Divide by ${r}: ${M(I(c.v)+' = '+n)}. The answer is ${n} ${c.pl}.`],
        alts:[{name:'Divide the start by the rate',steps:[`Each time uses up ${r}, and there are ${b} to start with.`,`${M(b+' ÷ '+r+' = '+n)} ${c.pl}.`]}],
        whyNum:[[b-r,`You subtracted the rate from the start once. That is the amount left after one ${c.pl.replace(/s$/,'')}, not the number of ${c.pl}. Solve ${M('0 = '+b+' − '+r+I(c.v))}.`],[b*r,`You multiplied. Dividing is what tells you how many ${r}s fit into ${b}: ${n}.`]]});
    }
    const k=R(2,n-1),left=b-r*k;
    return num(left,{prompt:`${intro} ${c.afterQ(k)}`,way:'Write the equation and plug in',
      hints:[`Start with ${b} and subtract ${r} for each: ${M(eq)}`,`Put in ${k}: ${M(I(c.Q)+' = '+b+' − '+r+'('+k+')')}`,`${M(r+'('+k+') = '+(r*k))}, so ${M(I(c.Q)+' = '+b+' − '+(r*k)+' = '+left)}.`],
      whyNum:[[b+r*k,`You added. The amount is going down, so subtract: ${b} − ${r*k} = ${left}.`],[r*k,`${r*k} is how much was used up. The question asks how much is left: ${b} − ${r*k} = ${left}.`]]});
  }
  const wr=[
    [I(`${c.Q} = ${b} + ${r}${c.v}`),`That has the amount growing. It is going down, so subtract: ${b} − ${r}${I(c.v)}.`],
    [I(`${c.Q} = ${r}${c.v} - ${b}`),`That starts at ${N(-b)} when ${I(c.v)} = 0. You start with ${b}, then subtract: ${b} − ${r}${I(c.v)}.`],
    [I(`${c.Q} = ${r} - ${b}${c.v}`),`You swapped the start and the rate. The start is ${b} (constant) and ${r} is lost per ${c.pl.replace(/s$/,'')}.`],
    [I(`${c.Q} = ${b}${c.v} - ${r}`),`You put ${b} next to ${I(c.v)}, but ${b} is the starting amount. The ${r} is what multiplies ${I(c.v)}.`]];
  return Object.assign(mcw(eq,shuffle(wr)),{prompt:`${intro} Which equation gives the ${c.what}?`,
    hints:[`The starting amount is ${b}. That is the constant.`,`${r} is taken away for every ${c.pl.replace(/s$/,'')}, so subtract ${r}${M(I(c.v))}.`,`Put them together: ${M(eq)}`]});
}

/* ---------- Level 2 ---------- */
function genL2(){
  const c=pick(DRAIN);let r,T0,t1;
  r=pick([5,6,8,10,12,15,20,25]);T0=R(14,40);t1=R(Math.max(3,Math.round(T0*.2)),Math.round(T0*.6));
  const S0=r*T0,w=S0-r*t1;
  const intro=c.intro(r,t1,w),eq=eqS(c.Q,c.v,-r,S0),vv=I(c.v),QQ=I(c.Q);
  const base=[`The amount is going down ${r} each ${c.unit.replace(/s$/,'')}, so the slope is ${M(N(-r))}: ${M(QQ+' = '+N(-r)+vv+' + b')}`,
    `Use the data point to find ${M('b')}. At ${M(vv+' = '+t1)} there are ${w}: ${M(w+' = '+N(-r)+'('+t1+') + b')}`,
    `${M(N(-r)+'('+t1+') = '+N(-r*t1))}, so ${M('b = '+w+' + '+(r*t1)+' = '+S0)}. The equation is ${M(eq)}`];
  const kind=pick(['eq','empty','empty','start','later']);
  const pre=`${intro} Let ${c.def}. `;
  if(kind==='eq'){
    const wr=[
      [eqS(c.Q,c.v,-r,w),`${w} is what is left after ${t1} ${c.unit}, not the amount at the start. At ${vv} = 0 you need ${S0}: add back the ${r*t1} that was used.`],
      [eqS(c.Q,c.v,r,S0),`The amount is going down, so the slope is negative: ${N(-r)}, not ${r}.`],
      [eqS(c.Q,c.v,-r,r*t1),`${r*t1} is only the amount used in ${t1} ${c.unit}. The start is what is left plus what was used: ${w} + ${r*t1} = ${S0}.`],
      [eqS(c.Q,c.v,-S0,r),`You swapped the rate and the start. The rate (${N(-r)}) multiplies ${vv}, and the start (${S0}) is the constant.`]];
    return Object.assign(mcw(eq,shuffle(wr)),{prompt:`${pre}Which equation models the situation?`,hints:[...base],
      alts:[ck(`Test the point: put ${M(vv+' = '+t1)} into ${M(eq)}.`,M(N(-r)+'('+t1+') + '+S0),w)]});
  }
  if(kind==='start')
    return num(S0,{prompt:`${pre}${c.startQ}`,way:'Build the equation, then use t = 0',
      hints:[...base.slice(0,2),`The start is where ${M(vv+' = 0')}, which is the constant ${M('b')}: ${M('b = '+w+' + '+(r*t1)+' = '+S0)}. The answer is ${S0}.`],
      alts:[{name:'Work backwards',steps:[`In ${t1} ${c.unit} it used ${M(r+' × '+t1+' = '+(r*t1))}.`,`So at the start there was ${M(w+' + '+(r*t1)+' = '+S0)}.`]}],
      whyNum:[[w,`${w} is what remains after ${t1} ${c.unit}, not the start. Add back what was used: ${w} + ${r*t1} = ${S0}.`],[r*t1,`${r*t1} is only what was used up. The start is what is left plus what was used: ${S0}.`],[w-r*t1,`You subtracted. Going back in time means adding back what was used: ${w} + ${r*t1}.`]]});
  if(kind==='later'){
    const x=R(t1+1,T0-1),ans=S0-r*x;
    return num(ans,{prompt:`${pre}${c.laterQ(x)}`,way:'Build the equation, then plug in',
      hints:[...base,`Put in ${M(vv+' = '+x)}: ${M(QQ+' = '+N(-r)+'('+x+') + '+S0+' = '+ans)}. The answer is ${ans}.`],
      alts:[{name:'Start from the data point',steps:[`From ${t1} to ${x} is ${x-t1} more ${c.unit}.`,`It uses ${M(r+' × '+(x-t1)+' = '+(r*(x-t1)))} more, so ${M(w+' − '+(r*(x-t1))+' = '+ans)}.`]}],
      whyNum:[[w-r*x,`You started from the ${w} (which is the amount at ${t1}) but subtracted for all ${x} ${c.unit}. Either start from ${S0} at time 0, or subtract only the extra ${x-t1}.`],[S0+r*x,`The amount is falling, so subtract: ${S0} − ${r*x}.`]]});
  }
  return num(T0,{prompt:`${pre}${c.emptyQ} Give your answer in ${c.unit}.`,way:'Build the equation, then set it to 0',
    hints:[...base,`Empty means the amount is 0: ${M('0 = '+N(-r)+vv+' + '+S0)}. Add ${r}${M(vv)} to both sides, then divide by ${r}: ${M(vv+' = '+S0+' ÷ '+r+' = '+T0)}. The answer is ${T0} ${c.unit}.`],
    alts:[{name:'Use the data point only',steps:[`${w} are left after ${t1} ${c.unit}, and ${r} go each ${c.unit.replace(/s$/,'')}.`,`That takes ${M(w+' ÷ '+r+' = '+(w/r))} more ${c.unit}.`,`Add the ${t1} that already passed: ${M(t1+' + '+(w/r)+' = '+T0)}.`]},
      ck(`Put ${M(vv+' = '+T0)} into ${M(eq)}.`,M(N(-r)+'('+T0+') + '+S0),0)],
    whyNum:[[w/r,`${w/r} is the time left after the first ${t1} ${c.unit}. The question asks for the total time from the start, so add ${t1}: ${T0}.`],[S0,`${S0} is the starting amount, not a time. Divide it by the rate: ${S0} ÷ ${r} = ${T0}.`]]});
