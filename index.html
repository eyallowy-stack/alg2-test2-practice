      alts:[{name:'Point-slope (skip finding b)',steps:[`Use the point ${M('('+x1+', '+y1+')')} and the slope ${M(N(m))}: ${M(I(Q)+' − '+N(y1)+' = '+N(m)+'('+v+' − '+x1+')')}`,`Put in ${y3}: ${M(N(y3-y1)+' = '+N(m)+'('+v+' − '+x1+')')}`,`Divide by ${N(m)}: ${M(v+' − '+x1+' = '+(x3-x1))}, so ${M(vv+' = '+x3)}.`]},
        ck(`Put ${M(vv+' = '+x3)} into ${M(eq)}.`,M(N(m)+'('+x3+') + '+N(b)),y3)],
      whyNum:[[x3-x1,`${x3-x1} is how many ${c.units} after the first point (${x1}). The question asks for the total number of ${c.units}, so add ${x1} back: ${x3}.`],
        [y3/m,`You divided ${y3} by the slope but skipped the starting value ${N(b)}. Subtract it first: (${y3} − (${N(b)})) ÷ ${N(m)} = ${x3}.`],

  }

      hints:[sl,ic,`Put in ${M(vv+' = '+x)}: ${M(I(Q)+' = '+N(m)+'('+x+') + '+N(b)+' = '+N(y3))}. The answer is ${y3}.`],
      alts:[{name:'Point-slope (skip finding b)',steps:[`Go from the point ${M('('+x2+', '+y2+')')}. That is ${x-x2} more ${c.units}.`,`Each adds ${M(N(m))}, so the change is ${M(N(m)+'('+(x-x2)+') = '+N(m*(x-x2)))}.`,`${M(N(y2)+' + ('+N(m*(x-x2))+') = '+N(y3))}.`]}],
      whyNum:[[m*x,`You forgot the starting value ${N(b)}. The equation is ${N(m)}${vv} + ${N(b)}, so add it: ${N(m*x)} + ${N(b)}.`],[y2+m*x,`You added the whole ${x} ${c.units} to the value at ${x2}. Only the ${x-x2} extra ${c.units} are new: ${y2} + ${N(m)}(${x-x2}).`]]});
  }
  if(kind==='start'){
    return num(b,{prompt:`${intro} ${c.startQ}`,way:'Slope, then intercept',
      hints:[sl,ic.replace(/ The equation is.*$/,''),`The start is where ${M(vv+' = 0')}, which is ${M('b')}. The answer is ${b}.`],
      alts:[{name:'Count backwards',steps:[`Each ${c.perU} changes it by ${M(N(m))}.`,`Going back ${x1} ${c.units} from ${y1}: ${M(N(y1)+' − ('+N(m)+')('+x1+') = '+N(b))}.`]}],
      whyNum:[[y1,`${y1} is the value at ${x1}, not at 0. Undo ${x1} ${c.units} of change: ${y1} − (${N(m)})(${x1}) = ${b}.`],[am,`${am} is the slope (the change per ${c.perU}), not the starting value.`]]});
  }
  if(kind==='slope'){
    const pairs=[[c.rate(am,!up),`The direction is backwards. The slope is ${N(m)}, so the quantity ${up?'goes up':'goes down'}.`],
      [c.start(am),`${am} is the slope: the change per ${c.perU}. The starting amount is the intercept, ${b}.`],
      [c.rate(b,up),`${b} is the starting value (the intercept). The slope is the change per ${c.perU}: ${am}.`],
      [c.rate(Math.abs(dy),up),`${Math.abs(dy)} is the total change between the two points. Divide by the ${dx} ${c.units} between them: ${Math.abs(dy)} ÷ ${dx} = ${am} per ${c.perU}.`]];
    return Object.assign(mcw(c.rate(am,up),shuffle(pairs)),{prompt:`${intro} Which statement describes the slope of the line?`,
      hints:[sl,`The slope is the change in ${I(Q)} for each 1 ${c.perU}. It is ${N(m)}, so the quantity ${up?'rises':'falls'} by ${am} per ${c.perU}.`]});
  }
  const wr=[
    [eqS(Q,v,m,y1),`${y1} is the value at ${x1}, not the value at 0. Find ${M('b')} with ${y1} = ${N(m)}(${x1}) + b, which gives ${b}.`],
    [eqS(Q,v,b,m),`You swapped the slope and the intercept. The slope ${N(m)} multiplies ${vv}; the intercept ${b} is the constant.`],
    [eqS(Q,v,m,-b),`The sign on the intercept is off. From ${y1} = ${N(m)}(${x1}) + b, b = ${y1} − (${N(m*x1)}) = ${b}.`],
    [eqS(Q,v,-m,b),`The slope has the wrong sign. The values go from ${y1} to ${y2}, so the slope is ${fr(N(dy),dx)} = ${N(m)}.`]];
  return Object.assign(mcw(eq,shuffle(wr)),{prompt:`${intro} Which equation models the situation?`,hints:[sl,ic],
    alts:[ck(`Test both points. Put ${M(vv+' = '+x1)} and ${M(vv+' = '+x2)} into ${M(eq)}.`,M(N(m)+'('+x1+') + '+N(b)+' = '+N(y1)+'; '+N(m)+'('+x2+') + '+N(b)),y2)]});
}

function gen(L){return L===1?genL1():L===2?genL2():genL3()}

TOPICS.push({id:'wordlines',name:'Linear equation word problems',

// ---- 07-bestfit.js
// Topic: Line of best fit and correlation
(()=>{
const r2=v=>Math.round(v*100)/100;
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
function stats(xs,ys){const mx=mean(xs),my=mean(ys);let sxy=0,sxx=0,syy=0;
  xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-my);sxx+=(x-mx)**2;syy+=(ys[i]-my)**2});
  return{r:sxy/Math.sqrt(sxx*syy),m:sxy/sxx,b:my-sxy/sxx*mx,sy:Math.sqrt(syy/xs.length)}}
const clamp=v=>Math.max(-5,Math.min(5,v));
const eqn=(y,x,m,b)=>I(`${y} = ${m}${x} ${b<0?'-':'+'} ${Math.abs(b)}`);

/* ---------- scatter data ---------- */
const KINDS={
  spos:{name:'strong positive',r:0.99},sneg:{name:'strong negative',r:-0.99},
  wpos:{name:'weak positive',r:0.55},wneg:{name:'weak negative',r:-0.55},none:{name:'no correlation',r:0}};
function scatter(kind){
  for(let tries=0;tries<5000;tries++){
    const n=R(7,9),xs=shuffle(range(-5,5)).slice(0,n).sort((a,b)=>a-b);
    const dir=kind.endsWith('pos')?1:kind.endsWith('neg')?-1:0;
    const s=0.7+Math.random()*0.3,noise=kind[0]==='s'?0.7:kind==='none'?6:2.4;
    const ys=xs.map(x=>clamp(Math.round(dir*s*x+(Math.random()*2-1)*noise)));
    const st=stats(xs,ys);if(!(st.sy>1.4))continue;
    const a=Math.abs(st.r);
    const ok=kind[0]==='s'?a>=0.92:kind[0]==='w'?(a>=0.45&&a<=0.75):a<0.2;
    if(ok&&(dir===0||Math.sign(st.r)===dir))return{xs,ys,st};
  }
  return null;
}
function plot(d,kind){
  const word=kind==='none'?'with no clear pattern':kind.endsWith('pos')?'trending upward from left to right':'trending downward from left to right';
  return svgGraph({segs:d.xs.map((x,i)=>({pts:[[x,d.ys[i]]],ends:['closed',null]})),
    label:`Scatter plot of ${d.xs.length} points ${word}. Points: ${d.xs.map((x,i)=>`(${N(x)}, ${N(d.ys[i])})`).join(', ')}`});
}

/* ---------- contexts for L2/L3 ---------- */
const CTX=[
  {y:'P',x:'w',what:'the price P, in dollars, of a container of detergent and its weight w, in pounds',yu:'dollars',xone:'pound',subj:'The price',zero:'a container weighs 0 pounds',
    ms:[0.12,0.15,0.2,0.25,0.5],bs:[1,1.5,2,3],xg:()=>R(4,16)*5,
    predq:x=>`Predict the price of a ${x}-pound container.`,solveq:y=>`How many pounds of detergent are predicted to cost ${y} dollars?`},
  {y:'P',x:'t',what:'the population P, in thousands, of a town and t, the number of years after 2000',yu:'thousand people',xone:'year',subj:'The population',zero:'the year is 2000',
    ms:[1.3,1.5,2.4,0.8,2.5],bs:[10,12,15,20,30,40],xg:()=>R(5,20),
    predq:x=>`Predict the population, in thousands, ${x} years after 2000.`,solveq:y=>`In how many years after 2000 is the population predicted to reach ${y} thousand?`},
  {y:'H',x:'d',what:'the height H, in centimeters, of a plant and d, the number of days after planting',yu:'centimeters',xone:'day',subj:'The height',zero:'the plant has just been planted',
    ms:[1.2,1.5,2,2.5],bs:[3,4,5,8,10],xg:()=>R(4,20),
    predq:x=>`Predict the height of the plant ${x} days after planting.`,solveq:y=>`After how many days is the plant predicted to be ${y} centimeters tall?`},
  {y:'C',x:'n',what:'the cost C, in dollars, of a taxi ride and n, the number of miles driven',yu:'dollars',xone:'mile',subj:'The cost',zero:'the ride is 0 miles long',
    ms:[1.5,2,2.5,3],bs:[3,3.5,4,5],xg:()=>R(3,18),
    predq:x=>`Predict the cost of a ${x}-mile ride.`,solveq:y=>`How many miles can you ride for ${y} dollars?`},
  {y:'T',x:'h',what:'the temperature T, in degrees Fahrenheit, and h, the number of hours after noon',yu:'degrees',xone:'hour',subj:'The temperature',zero:'it is noon',neg:true,
    ms:[-1.5,-2,-2.5,-3],bs:[70,72,75,80,85],xg:()=>R(2,8),
    predq:x=>`Predict the temperature ${x} hours after noon.`,solveq:y=>`After how many hours is the temperature predicted to be ${y} degrees?`},
  {y:'S',x:'h',what:'the test score S, in points, of a student and h, the number of hours the student studied',yu:'points',xone:'hour',subj:'The score',zero:'the student studied 0 hours',
    ms:[3,4,5,6],bs:[40,45,50,55],xg:()=>R(1,6),
    predq:x=>`Predict the score of a student who studied ${x} hours.`,solveq:y=>`How many hours of studying are predicted to give a score of ${y}?`},
];
const plural=(c,n)=>Math.abs(n)===1?c.xone:c.xone+'s';
const dirOf=m=>m>0?'increases':'decreases';
const slopeSent=(c,m)=>`${c.subj} ${dirOf(m)} by about ${Math.abs(m)} ${c.yu} for each additional ${c.xone}.`;
const zeroSent=(c,b)=>`${c.subj} is about ${b} ${c.yu} when ${c.zero}.`;

function genBest(L){
  /* ===== Level 1: type of correlation ===== */
  if(L===1){
    const kind=pick(['spos','sneg','wpos','wneg','none']),d=scatter(kind);
    const asR=Math.random()<.4&&kind!=='none',asTable=!asR&&Math.random()<.35;
    const pts=d.xs.map((x,i)=>`(${N(x)}, ${N(d.ys[i])})`).join(', ');
    const dirH=kind==='none'?'The dots don’t go up or down in any steady way.':kind.endsWith('pos')?'Going left to right the dots go up, so the correlation is positive.':'Going left to right the dots go down, so the correlation is negative.';
    const strH=kind==='none'?'They are scattered with no pattern, so there is no correlation (r is near 0).':kind[0]==='s'?'The dots hug a line closely, so it is strong.':'The dots follow the direction but are spread out, so it is weak.';
    if(asR){
      const all=[0.99,0.55,-0.55,-0.99],ans=KINDS[kind].r;
      const fmt=v=>N(v);
      const reason={[N(0.99)]:'0.99 is a strong positive: the dots would sit almost exactly on an upward line.',
        [N(0.55)]:'0.55 is a weak positive: the dots trend upward but are spread out.',
        [N(-0.55)]:'−0.55 is a weak negative: the dots trend downward but are spread out.',
        [N(-0.99)]:'−0.99 is a strong negative: the dots would sit almost exactly on a downward line.'};
      const pairs=all.filter(v=>v!==ans).map(v=>{
        const sameSign=Math.sign(v)===Math.sign(ans);
        const why=sameSign?`${reason[fmt(v)]} In this plot the dots are ${kind[0]==='s'?'tighter than that':'more spread out than that'}, so r is ${fmt(ans)}.`
          :`${reason[fmt(v)]} This plot trends ${ans>0?'upward':'downward'}, so the sign of r must be ${ans>0?'positive':'negative'}.`;
        return[fmt(v),why]});
      return Object.assign(mcw(fmt(ans),pairs,true),{
        prompt:'The correlation coefficient <b>r</b> for this scatter plot is closest to which value?',
        graph:plot(d,kind),
        hints:[dirH,`Sign first: ${ans>0?'positive r':'negative r'}, so only ${ans>0?'0.99 and 0.55':'−0.55 and −0.99'} are left.`,kind[0]==='s'?`${strH} Strong means r is near ±1, so r ≈ ${fmt(ans)}.`:`${strH} Weak means r is near ±0.5, so r ≈ ${fmt(ans)}.`]});
    }
    const names=Object.keys(KINDS).filter(k=>k!==kind);
    const opp=kind==='none'?pick(['spos','sneg']):kind.slice(0,1)+(kind.endsWith('pos')?'neg':'pos');
    const pool=shuffle(names.filter(k=>k!==opp)).slice(0,2);
    const why=k=>{const t=KINDS[k].name;
      if(k==='none')return'The dots do follow a direction, so there is a correlation.';
      if(kind==='none')return`There is no pattern to follow, so “${t}” claims too much.`;
      const sameDir=k.slice(1)===kind.slice(1),sameStr=k[0]===kind[0],up=kind.endsWith('pos');
      if(sameStr)return`This has the right strength but the wrong direction: the dots go ${up?'up':'down'} left to right, not ${up?'down':'up'}.`;
      if(sameDir)return t.startsWith('strong')?'The dots are spread out too much for “strong”. Check how tightly they follow the trend.':'The dots hug the line too closely for “weak”. Check how tightly they follow the trend.';
      return`Both are off: the dots go ${up?'up':'down'} left to right, and the strength is ${kind[0]==='s'?'strong':'weak'}, not ${t.split(' ')[0]}.`};
    const pairs=[opp,...pool].map(k=>[KINDS[k].name,why(k)]);
    const base=asTable?{table:tbl([[X,...d.xs],[Y,...d.ys]])}:{graph:plot(d,kind)};
    return Object.assign(mcw(KINDS[kind].name,pairs),base,{
      prompt:asTable?`The table shows ${X} and ${Y}. What type of correlation does the data show?`:'What type of correlation does this scatter plot show?',
      hints:[asTable?`Read the ${Y} row as ${X} gets bigger: ${d.ys.join(', ').replace(/-/g,'−')}. ${kind==='none'?'It goes up and down with no steady direction.':kind.endsWith('pos')?'It mostly goes up.':'It mostly goes down.'}`:dirH,strH,`Answer: ${KINDS[kind].name}.`]});
  }

  /* ===== Level 2: predict and interpret ===== */
  if(L===2){
    const c=pick(CTX),m=pick(c.ms),b=pick(c.bs),t=pick(['pred','pred','solve','slope']);
    const eq=eqn(c.y,c.x,m,b),intro=`The line of best fit for ${c.what}, is `;
    if(t==='pred'){
      const x=c.xg(),ans=r2(m*x+b);
      return num(ans,{dec:true,prompt:`${intro}<b>${eq}</b>. ${c.predq(x)} Give the number only.`,math:eq,
        whyNum:[[r2(m*x),`You multiplied ${m} × ${x} but forgot to add the ${b}. The intercept is part of the line: ${m} × ${x} ${b<0?'−':'+'} ${Math.abs(b)}.`],
          [r2((m+b)*x),`You added ${m} + ${b} first and then multiplied by ${x}. Multiply first: ${m} × ${x}, then add ${b}.`]],
        hints:[`Replace ${I(c.x)} with ${x}: ${I(c.y)} = ${m}(${x}) ${b<0?'−':'+'} ${Math.abs(b)}.`,`Multiply first: ${m} × ${x} = ${N(r2(m*x))}.`,`Then add: ${N(r2(m*x))} ${b<0?'−':'+'} ${Math.abs(b)} = ${N(ans)}.`]});
    }
    if(t==='solve'){
      const x=c.xg(),yv=r2(m*x+b);
      return num(x,{dec:true,prompt:`${intro}<b>${eq}</b>. ${c.solveq(yv)} Give the number only.`,math:eq,
        whyNum:[[r2(m*yv+b),`You plugged ${yv} in for ${c.x}. ${yv} is the value of ${c.y}, so replace ${c.y}, not ${c.x}.`],
          [r2(yv-b),`You subtracted ${b} but forgot to divide by ${m}. Finish with ÷ ${m}.`]],
        hints:[`The output ${I(c.y)} is ${yv}. Put it in: ${yv} = ${m}${I(c.x)} ${b<0?'−':'+'} ${Math.abs(b)}.`,`Subtract ${b} from both sides: ${N(r2(yv-b))} = ${m}${I(c.x)}.`,`Divide both sides by ${m}: ${I(c.x)} = ${x}.`],
        alts:[{name:'Check by plugging in',steps:[`${m}(${x}) ${b<0?'−':'+'} ${Math.abs(b)} = ${N(r2(m*x))} ${b<0?'−':'+'} ${Math.abs(b)} = ${N(yv)}. It matches, so ${c.x} = ${x}.`]}]});
    }
    const pairs=[[`${c.subj} ${m>0?'decreases':'increases'} by about ${Math.abs(m)} ${c.yu} for each additional ${c.xone}.`,`That is the wrong direction. The slope ${N(m)} is ${m>0?'positive, so it goes up':'negative, so it goes down'}.`],
      [zeroSent(c,b),`That reads the ${N(b)} (the y-intercept), which is the value at ${c.x} = 0. The slope is the number multiplying ${c.x}.`],
      [`${c.subj} ${dirOf(m)} by about ${b} ${c.yu} for each additional ${c.xone}.`,`${b} is the intercept, not the rate. The rate of change is the slope, ${N(m)}.`],
      [zeroSent(c,Math.abs(m)),`${N(m)} is the slope, so it is a rate of change, not a starting amount.`]];
    return Object.assign(mcw(slopeSent(c,m),pairs),{prompt:`${intro}<b>${eq}</b>. Which statement correctly interprets the <b>slope</b> of the line?`,math:eq,
      hints:[`In ${I('y = mx + b')} the slope is the number multiplying ${I(c.x)}. Here it is ${N(m)}.`,`Slope = change in ${I(c.y)} per 1 unit of ${I(c.x)}, with units: ${Math.abs(m)} ${c.yu} per ${c.xone}.`,`${N(m)} is ${m>0?'positive, so the amount goes up':'negative, so the amount goes down'}. ${slopeSent(c,m)}`]});
  }

  /* ===== Level 3 ===== */
  const t=Math.random();
  if(t<0.35){
    /* equation that fits a scatter plot */
    for(let tries=0;tries<5000;tries++){
      const m=pick([1,-1,0.5,-0.5]),b=pick([-2,-1,0,1,2]),n=R(7,9),xs=shuffle(range(-5,5)).slice(0,n).sort((a,c)=>a-c);
      const ys=xs.map(x=>Math.round(m*x+b+pick([-1,0,0,0,1])));
      if(ys.some(y=>y<-5||y>5))continue;
      const st=stats(xs,ys);if(Math.abs(st.m-m)>0.15||Math.abs(st.b-b)>0.5||!(st.sy>1.4))continue;
      const ms=v=>v===1?'':v===-1?'−':(v<0?'−':'')+(Math.abs(v)===0.5?fr(1,2):Math.abs(v));
      const E=(mm,bb)=>`${Y} = ${ms(mm)}${X}${tail(bb)}`;
      const bAlt=b===0?3:-b;
      const correct=E(m,b);
      const pairs=[[E(-m,b),`This has the right intercept but the wrong slope sign. The dots go ${m>0?'up':'down'} left to right, so the slope is ${m>0?'positive':'negative'}.`],
        [E(m,bAlt),`The slope is right, but the line would cross the ${Y}-axis at ${N(bAlt)}. The dots line up with a line that crosses at ${N(b)}.`],
        [E(-m,bAlt),`Both parts are off: the slope has the wrong sign and the ${Y}-intercept is ${N(bAlt)} instead of ${N(b)}.`],
        [E(m*2,b),`The slope is too steep. Going 2 to the right, the dots ${m>0?'rise':'fall'} ${Math.abs(m)*2}, so the slope is ${N(m)}, not ${N(m*2)}.`]];
      const rise=Math.abs(m)===1?'1 for every 1 step right':'1 for every 2 steps right';
      return Object.assign(mcw(correct,pairs),{prompt:'Which equation best represents the line of best fit for this scatter plot?',graph:plot({xs,ys},m>0?'spos':'sneg'),
        hints:[`Slope: the dots go ${m>0?'up':'down'} left to right, so the slope is ${m>0?'positive':'negative'}. They ${m>0?'rise':'fall'} about ${rise}, so the slope is ${N(m)}.`,
          `Intercept: a line through the middle of the dots crosses the ${Y}-axis near ${N(b)}.`,`Match both: ${correct}.`]});
    }
  }
  if(t<0.65){
    /* line through two points on the best-fit line, then predict */
    const c=pick(CTX),m=c.neg?pick([-2,-3,-4]):pick([2,3,4,5]),b=Math.round(pick(c.bs)),x1=R(1,3),x2=x1+R(2,4),x3=x2+R(3,6);
    const y1=m*x1+b,y2=m*x2+b,ans=m*x3+b;
    return num(ans,{dec:true,prompt:`A line of best fit for ${c.what}, passes through the points (${x1}, ${N(y1)}) and (${x2}, ${N(y2)}). Use it to predict ${I(c.y)} when ${I(c.x)} = ${x3}. Give the number only.`,
      whyNum:[[m*x3,`You multiplied the slope by ${x3} but left out the starting value. Use ${I(c.y)} = ${m}${I(c.x)} ${b<0?'−':'+'} ${Math.abs(b)}.`],
        [y2+m,`That adds the slope only once. From ${I(c.x)} = ${x2} to ${x3} is ${x3-x2} steps, so add ${m} that many times.`],
        [y2+(x3-x2),`You added the number of steps but did not multiply by the slope ${N(m)} for each step.`]],
      hints:[`Slope = (${N(y2)} − ${N(y1)}) ÷ (${x2} − ${x1}) = ${N(y2-y1)} ÷ ${x2-x1} = ${N(m)}.`,
        `Use point-slope with (${x1}, ${N(y1)}): ${I(c.y)} − ${N(y1)} = ${N(m)}(${I(c.x)} − ${x1}), which simplifies to ${I(c.y)} = ${m}${I(c.x)} ${b<0?'−':'+'} ${Math.abs(b)}.`,
        `Put in ${I(c.x)} = ${x3}: ${m}(${x3}) ${b<0?'−':'+'} ${Math.abs(b)} = ${N(ans)}.`],
      alts:[{name:'Count steps from the second point',steps:[`The slope is ${N(m)} per 1 unit of ${I(c.x)}.`,`From ${I(c.x)} = ${x2} to ${x3} is ${x3-x2} units, so ${I(c.y)} changes by ${N(m)} × ${x3-x2} = ${N(m*(x3-x2))}.`,`${N(y2)} ${m*(x3-x2)<0?'−':'+'} ${Math.abs(m*(x3-x2))} = ${N(ans)}.`]}]});
  }
  if(t<0.8){
    const c=pick(CTX),m=pick(c.ms),b=pick(c.bs),eq=eqn(c.y,c.x,m,b),amt=`${Math.abs(m)} ${c.yu}`;
    const ok=`${c.subj} ${m>0?'increased':'decreased'} by about the same amount, ${amt}, each ${c.xone}.`;
    const pairs=[[`${c.subj} ${m>0?'increased':'decreased'} faster and faster each ${c.xone}.`,`A line has a constant slope, so the change is the same every ${c.xone}, not speeding up.`],
      [`${c.subj} ${m>0?'decreased':'increased'} by about ${amt} each ${c.xone}.`,`Wrong direction. The slope ${N(m)} is ${m>0?'positive':'negative'}.`],
      [`${c.subj} stayed about ${b} ${c.yu} the whole time.`,`That would need a slope of 0. The slope is ${N(m)}, so the amount keeps changing.`],
      [`${c.subj} ${m>0?'increased':'decreased'} by about ${b} ${c.yu} each ${c.xone}.`,`${b} is the intercept, not the rate. The change per ${c.xone} is the slope, ${N(m)}.`]];
    return Object.assign(mcw(ok,pairs),{prompt:`The line of best fit for ${c.what}, is <b>${eq}</b>. Which statement is true?`,math:eq,
      hints:[`The slope is ${N(m)}. A straight line has the same slope everywhere, so ${c.y} changes by the same amount each ${c.xone}.`,`The slope is ${m>0?'positive':'negative'}, so ${c.y} ${dirOf(m)}.`,ok]});
  }
  const c=pick(CTX),m=pick(c.ms),b=pick(c.bs),eq=eqn(c.y,c.x,m,b);
  const pairs=[[`${c.subj} ${dirOf(m)} by about ${b} ${c.yu} for each additional ${c.xone}.`,`That uses ${b} as a rate. ${b} is what you get when ${c.x} = 0, a starting amount.`],
    [zeroSent(c,Math.abs(m)),`${N(m)} is the slope (the rate of change), not the starting amount.`],
    [`${c.subj} is about ${b} ${c.yu} when ${c.x} = ${b}.`,`The ${b} is the value of ${c.y}, not of ${c.x}. It happens when ${c.x} = 0.`]];

// ---- 08-piece.js
// Topic: Piecewise linear functions  (Alg 2 Test #2)
(()=>{
/* ---------- helpers ---------- */
const paren=n=>n<0?`(${N(n)})`:N(n);

const ownIdx=(ps,x)=>ps.findIndex(p=>owns(p,x));

const ord=i=>['first','second','third'][i];

/* condition text for a piece: x < 1, 1 ≤ x < 4, x ≥ 4 */
function cond(p){
  if(p.lo===null)return `${X} ${p.hiInc?'≤':'&lt;'} ${N(p.hi)}`;
  if(p.hi===null)return `${X} ${p.loInc?'≥':'&gt;'} ${N(p.lo)}`;
  return `${N(p.lo)} ${p.loInc?'≤':'&lt;'} ${X} ${p.hiInc?'≤':'&lt;'} ${N(p.hi)}`;
}
/* piecewise display: a left brace drawn as a big "{" cell spanning the rows, then "expression, if condition" rows.
   Inline styles only, so it sits inside .math or a choice button without touching the engine's CSS. */
function pwRows(rows,name,small){
  const n=rows.length,fz=small?1.15:1.45;
  const body=rows.map((r,i)=>`<tr>${i?'':`<td rowspan="${n}" style="padding:0 .3em 0 .25em;font-size:${(n*fz).toFixed(2)}em;line-height:1;font-weight:200;vertical-align:middle">{</td>`}<td style="padding:${small?'1px':'3px'} 1em ${small?'1px':'3px'} 0;text-align:left;white-space:nowrap">${r[0]}</td><td style="padding:${small?'1px':'3px'} 0;text-align:left;white-space:nowrap">if ${r[1]}</td></tr>`).join('');
  return `${name?`${F(name)}(${X}) = `:''}<table style="display:inline-table;vertical-align:middle;border-collapse:collapse;border:0;margin:0"><tbody>${body}</tbody></table>`;
}
const pw=(ps,name,small)=>pwRows(ps.map(p=>[ex(p),cond(p)]),name,small);

/* random piecewise formula, n pieces, unbounded ends. Break points are owned by one side at random. */
function genF(n){
  for(;;){
    const cs=n===2?[R(-3,3)]:(a=>[a,a+R(2,4)])(R(-4,1));
    const ps=cs.concat([null]).map((c,i)=>({lo:i?cs[i-1]:null,hi:c,loInc:false,hiInc:false,m:pick([-3,-2,-1,1,2,3,-2,2,1,-1,0]),b:R(-6,6)}));
    for(let j=0;j<n-1;j++){const L=Math.random()<.5;ps[j].hiInc=L;ps[j+1].loInc=!L}
    let ok=true;
    for(let j=0;j<n-1;j++){const c=cs[j];if(ps[j].m*c+ps[j].b===ps[j+1].m*c+ps[j+1].b)ok=false;if(ps[j].m===ps[j+1].m&&ps[j].b===ps[j+1].b)ok=false}

/* explain which piece x = a uses */
function whichHint(ps,a){
  const i=ownIdx(ps,a),p=ps[i],isBreak=ps.some((q,j)=>j<ps.length-1&&q.hi===a);
  let s=`Test ${X} = ${N(a)} against each condition. It fits ${M(cond(p))}, so use the ${ord(i)} piece, ${M(ex(p))}.`;
  if(isBreak)s+=` ${N(a)} is exactly a break point, so the sign matters: only ${M(cond(p))} includes it (≤ and ≥ include the number, &lt; and &gt; do not).`;
  return s;
}
function evalQ(ps,a,name){
  const i=ownIdx(ps,a),p=ps[i],v=val(ps,a),isBreak=ps.some((q,j)=>j<ps.length-1&&q.hi===a);
  const wn=[];ps.forEach((q,j)=>{const w=q.m*a+q.b;if(j!==i&&w!==v&&!wn.some(z=>z[0]===w))wn.push([w,`That plugs ${X} = ${N(a)} into the ${ord(j)} piece, but ${N(a)} doesn’t satisfy ${M(cond(q))}.${isBreak?' Check the &lt; versus ≤ at the break point.':' Check the conditions first.'} The ${ord(i)} piece gives ${N(v)}.`])});
  return num(v,{prompt:`Find ${F(name)}(${N(a)}).`,math:pw(ps,name),whyNum:wn,
    hints:[whichHint(ps,a),(p.m===0?cst(v):`Plug ${N(a)} into only that piece: ${M(sub([p.b,p.m],N(a))+' = '+N(v))}.`),`${F(name)}(${N(a)}) = ${N(v)}.`]});
}

/* ---------- graph pieces ----------
   n linear pieces over x0<x1<..<xn. Junctions are jumps (one closed dot, one open circle) or, unless jumpOnly, continuous.
   o.mono = +1/-1 makes every piece and jump go the same direction (one-to-one). */
function genGraph(n,o={}){
  for(let t=0;t<2000;t++){
    const xs=[R(-5,-3)];for(let i=0;i<n;i++)xs.push(xs[i]+R(1,3));
    if(xs[n]>5)continue;
    const s=o.mono||0,ps=[],cont=[];let y=s>0?R(-5,-2):s<0?R(2,5):R(-4,4),ok=true;
    for(let i=0;i<n;i++){
      if(i){const c=!o.jumpOnly&&Math.random()<.35;cont.push(c);if(!c){const d=R(1,3);y+=s?s*d:(Math.random()<.5?d:-d)}}
      const m=s?s*R(1,2):pick([-2,-1,-1,1,1,2,0]),y2=y+m*(xs[i+1]-xs[i]);
      if(Math.abs(y)>5||Math.abs(y2)>5){ok=false;break}
      ps.push({lo:xs[i],hi:xs[i+1],loInc:true,hiInc:true,m,b:y-m*xs[i]});y=y2;
    }
    if(!ok)continue;
    ps[0].loInc=Math.random()<.6;ps[n-1].hiInc=Math.random()<.6;
    for(let j=0;j<n-1;j++)if(!cont[j]){const L=Math.random()<.5;ps[j].hiInc=L;ps[j+1].loInc=!L}
    return{ps,cont};
  }
  return genGraph(n,o);
}
function drawG(g,label){
  return svgGraph({label,segs:g.ps.map((p,i)=>({pts:[[p.lo,p.m*p.lo+p.b],[p.hi,p.m*p.hi+p.b]],
    ends:[i&&g.cont[i-1]?null:(p=>p.loInc?'closed':'open')(p),i<g.ps.length-1&&g.cont[i]?null:(p=>p.hiInc?'closed':'open')(p)]}))});
}
/* range as a merged interval, or null when it has a gap */
function rangeOf(ps){
  const iv=ps.map(p=>{const y1=p.m*p.lo+p.b,y2=p.m*p.hi+p.b;
    if(p.m===0)return{lo:y1,hi:y1,li:true,ui:true};
    return p.m>0?{lo:y1,hi:y2,li:p.loInc,ui:p.hiInc}:{lo:y2,hi:y1,li:p.hiInc,ui:p.loInc}}).sort((a,b)=>a.lo-b.lo||(b.li-a.li));
  let c={...iv[0]};
  for(const v of iv.slice(1)){
    if(v.lo<c.hi||(v.lo===c.hi&&(v.li||c.ui))){
      if(v.lo===c.lo)c.li=c.li||v.li;
      if(v.hi>c.hi){c.hi=v.hi;c.ui=v.ui}else if(v.hi===c.hi)c.ui=c.ui||v.ui;
    }else return null;
  }

}
const ineq=(v,lo,li,hi,ui)=>lo===hi?`${v} = ${N(lo)}`:`${N(lo)} ${li?'≤':'&lt;'} ${v} ${ui?'≤':'&lt;'} ${N(hi)}`;
const domOf=ps=>({lo:ps[0].lo,li:ps[0].loInc,hi:ps[ps.length-1].hi,ui:ps[ps.length-1].hiInc});
const dotWord=inc=>inc?'a closed dot, so it is included':'an open circle, so it is not included';

/* ---------- generators ---------- */
function level1(){
  const ps=genF(2),c=ps[0].hi,name=pick(['f','g','h']);
  let a;if(Math.random()<.5)a=c;else{do{a=R(c-4,c+4)}while(a===c)}
  return evalQ(ps,a,name);
}

function eval3(){
  const ps=genF(3),name=pick(['f','g','h']),c1=ps[0].hi,c2=ps[1].hi;
  const a=pick([c1,c2,R(c1-4,c1-1),R(c1+1,c2-1),R(c2+1,c2+4)]);
  return evalQ(ps,a,name);
}

function readG(){
  let g,a;
  do{g=genGraph(pick([2,3]));a=R(g.ps[0].lo,g.ps[g.ps.length-1].hi)}while(ownIdx(g.ps,a)<0);
  // favor break points
  if(Math.random()<.6){const brk=g.ps.slice(0,-1).map(p=>p.hi);a=pick(brk)}
  const nm=pick(['f','g','h']),v=val(g.ps,a),i=ownIdx(g.ps,a),isJump=g.ps.some((p,j)=>j<g.ps.length-1&&p.hi===a&&!g.cont[j]);
  const wn=[];
  g.ps.forEach((p,j)=>{const w=p.m*a+p.b;if(j!==i&&(p.lo===a||p.hi===a)&&w!==v)wn.push([w,`That is the height of the open circle at ${X} = ${N(a)}. An open circle means that point is not on the graph; the closed dot, at height ${N(v)}, is.`])});
  return num(v,{prompt:`The graph of ${F(nm)} is shown. Find ${F(nm)}(${N(a)}).`,graph:drawG(g,`Graph of a piecewise linear function made of ${g.ps.length} line segments`),whyNum:wn,
    hints:[`Find ${X} = ${N(a)} on the horizontal axis and look at the graph directly above or below it.`,
      isJump?`There is a jump here: one end has a closed dot and the other an open circle. The closed dot is the real value of the function.`:`The graph passes through a single point at ${X} = ${N(a)}.`,
      `${F(nm)}(${N(a)}) = ${N(v)}.`]});
}

function domRange(){
  let g,R_;do{g=genGraph(pick([2,3]));R_=rangeOf(g.ps)}while(!R_);
  const D=domOf(g.ps),ps=g.ps;
  const A=(d,r)=>`Domain: ${d} &nbsp;Range: ${r}`;
  const dTxt=(d=D,flip)=>ineq(X,d.lo,flip?!d.li:d.li,d.hi,flip?!d.ui:d.ui),rTxt=(r=R_,flip)=>ineq(Y,r.lo,flip?!r.li:r.li,r.hi,flip?!r.ui:r.ui);
  const right=A(dTxt(),rTxt());
  const ends=[ps[0].m*ps[0].lo+ps[0].b,ps[ps.length-1].m*ps[ps.length-1].hi+ps[ps.length-1].b],eLo=Math.min(...ends),eHi=Math.max(...ends);
  const pairs=[
    [A(ineq(X,R_.lo,R_.li,R_.hi,R_.ui),ineq(Y,D.lo,D.li,D.hi,D.ui)),`You swapped them. Domain is the ${X}-values (left to right) and range is the ${Y}-values (bottom to top).`],
    [A(ineq(X,D.lo,true,D.hi,true),ineq(Y,R_.lo,true,R_.hi,true)),`You used ≤ everywhere, but an end that is an open circle (and not reached anywhere else) needs &lt;.`],
    [A(dTxt(),rTxt(R_,true)),`The range’s ${Y}-limits have the wrong inequality signs. Look at the dot at the lowest and highest ${Y}-values: closed means ≤, open circle means &lt;.`],
    [A(dTxt(D,true),rTxt()),`The domain’s ${X}-limits have the wrong inequality signs. A closed dot at the left or right end means ≤, an open circle means &lt;.`],
    [A(dTxt(),ineq(Y,eLo,true,eHi,true)),`You took the range from only the two outside end points. A piece in the middle can go higher or lower than the ends; look for the lowest and highest point on the whole graph.`]];
  return Object.assign(mcw(right,pairs),{prompt:'The graph of a function is shown. Find its domain and range. Write them as inequalities.',
    graph:drawG(g,`Graph of a piecewise linear function made of ${ps.length} line segments`),
    hints:[`Domain (${X}-values), left to right: it starts at ${X} = ${N(D.lo)} (${dotWord(D.li)}) and ends at ${X} = ${N(D.hi)} (${dotWord(D.ui)}). Domain: ${M(dTxt())}.`,
      `Range (${Y}-values), bottom to top: the lowest height reached is ${Y} = ${N(R_.lo)} (${R_.li?'included, because it is reached at a closed dot or on a line':'not included, because it is only reached at an open circle'}) and the highest is ${Y} = ${N(R_.hi)} (${R_.ui?'included':'not included, only an open circle is there'}).`,
      `Range: ${M(rTxt())}. Domain: ${M(dTxt())}.`]});
}

function solveQ(){
  for(let t=0;t<600;t++){
    const n=pick([2,3,3]),ps=genF(n),k=R(-6,9),nm=pick(['f','g','h']);
    let valid=[],extra=[],bad=false;
    ps.forEach((p,i)=>{
      if(p.m===0){if(p.b===k)bad=true;return}
      const raw=(k-p.b)/p.m;
      if(Number.isInteger(raw)){(owns(p,raw)?valid:extra).push({i,x:raw})}
      else if(owns(p,raw))bad=true;
    });
    if(bad||!valid.length)continue;
    if(valid.length<(Math.random()<.55?2:1)&&t<500)continue;
    valid.sort((a,b)=>a.x-b.x);
    const list=a=>a.map(s=>`${X} = ${N(s.x)}`).join(' or ');
    const right=list(valid),all=valid.concat(extra).sort((a,b)=>a.x-b.x);
    const pairs=[];
    if(extra.length)pairs.push([list(all),`You solved every piece but kept an answer that breaks its condition: ${X} = ${N(extra[0].x)} came from the ${ord(extra[0].i)} piece, which only works for ${M(cond(ps[extra[0].i]))}. Throw it out.`]);
    if(valid.length>1)pairs.push([list([valid[0]]),`That is only one answer. The ${ord(valid[1].i)} piece also gives ${N(k)} at ${X} = ${N(valid[1].x)}, and it fits its condition.`]);
    else if(extra.length)pairs.push([list(extra),`That answer does not fit its condition: ${X} = ${N(extra[0].x)} is not allowed in the ${ord(extra[0].i)} piece, ${M(cond(ps[extra[0].i]))}. The valid one is ${X} = ${N(valid[0].x)}.`]);
    pairs.push([list(valid.map(s=>({x:-s.x}))),`You flipped a sign while solving. Plug your answers back in; they don’t give ${N(k)}.`]);
    pairs.push([`${X} = ${N(k)}`,`${N(k)} is the output. The question asks which inputs ${X} give an output of ${N(k)}.`]);
    const s0=valid[0],p0=ps[s0.i];
    if(Math.abs(p0.m)!==1)pairs.push([list([{x:k-p0.b}].concat(valid.slice(1))),`You subtracted ${N(p0.b)} but forgot to divide by ${N(p0.m)}: ${M(N(p0.m)+X+' = '+N(k-p0.b))} → ${X} = ${N(s0.x)}.`]);
    pairs.push([list(valid.map(s=>({x:s.x+1}))),`That is off by one. Check by plugging it into the piece it belongs to.`]);
    const rows=[];
    ps.forEach((p,i)=>{
      if(p.m===0)rows.push(`${ord(i)} piece: ${M(ex(p))} is a constant, never equal to ${N(k)}.`);
      else{const raw=(k-p.b)/p.m,okc=Number.isInteger(raw)&&owns(p,raw);
        rows.push(`${ord(i)} piece: ${M(ex(p)+' = '+N(k))} → ${M(X+' = '+fs(k-p.b,p.m))}. Condition ${M(cond(p))}: ${okc?'fits, keep it':'does not fit, reject it'}.`)}});
    return Object.assign(mcw(right,pairs),{prompt:`Find every ${X} for which ${F(nm)}(${X}) = ${N(k)}.`,math:pw(ps,nm),
      alts:[{name:'Check each answer',steps:valid.map(s=>`${M(`${F(nm)}(${N(s.x)}) = ${sb(ps[s.i],N(s.x))}${N(k)}`)} ✓`).concat(extra.length?[`Check the rejected one too: ${X} = ${N(extra[0].x)} makes the ${ord(extra[0].i)} piece equal ${N(k)}, but ${N(extra[0].x)} doesn’t satisfy ${M(cond(ps[extra[0].i]))}, so the function doesn’t use that piece there.`]:[])}],
      hints:[`Set each piece equal to ${N(k)}, solve, and then check that the answer is allowed in that piece (its condition).`,rows.join('<br>'),`Keep only the answers that fit: ${M(right)}.`]});

}

function writeQ(){
  const g=genGraph(pick([2,2,3]),{jumpOnly:true}),ps=g.ps,n=ps.length;
  const right=pw(ps,null,true);
  const pairs=[];
  // wrong ownership at the first break
  {const q=ps.map(p=>({...p}));q[0].hiInc=!q[0].hiInc;q[1].loInc=!q[1].loInc;
   pairs.push([pw(q,null,true),`The two lines are right, but the &lt; and ≤ are swapped at ${X} = ${N(ps[0].hi)}. The closed dot sits on the ${ps[0].hiInc?'first':'second'} piece, so that is the piece with ≤ (or ≥).`])}
  // wrong slope sign on one piece
  {const j=ps.findIndex(p=>p.m!==0);if(j>=0){const q=ps.map(p=>({...p}));q[j].m=-q[j].m;
   pairs.push([pw(q,null,true),`The ${ord(j)} piece has the wrong slope sign. Going right, that piece ${ps[j].m>0?'rises':'falls'}, so its slope is ${N(ps[j].m)}.`])}}

  return Object.assign(mcw(right,pairs,false),{prompt:'Which piecewise function matches the graph?',
    graph:drawG(g,`Graph of a piecewise linear function made of ${n} line segments with jumps`),
    hints:[`Find each piece’s line separately: read two points on it, get the slope, then solve for ${F('b')}.`,lines,`Now the conditions. A closed dot means the ${X}-value is included (≤ or ≥); an open circle means it is not (&lt; or &gt;). ${brk}`]});
}

function contQ(){
  for(let t=0;t<500;t++){
    const type=pick(['A','B','C','A','B']);
    const c=pick([1,2,2,3,3,4,-1,-2,-3]),nm=pick(['f','g','h']);
    const m=nz(-3,3),b=R(-6,6),p=R(-5,5);
    let rows,k,known,eq,wn=[];
    const Lc=Math.random()<.5,Rc=!Lc;  // which side owns c (does not matter for continuity)
    const cl={lo:null,hi:c,hiInc:Lc},cr={lo:c,hi:null,loInc:Rc};
    const kk=F('k');
    if(type==='A'){ // left: kx + p ; right: mx + b

      rows=[[`${kk}${X}${tail(p)}`,cond(cl)],[ex({m,b}),cond(cr)]];

    }else if(type==='B'){ // left: mx + p ; right: kx + b
      known=m*c+p;k=(known-b)/c;if(!k)continue;
      rows=[[ex({m,b:p}),cond(cl)],[`${kk}${X}${tail(b)}`,cond(cr)]];
      eq=[`${M(kk+'('+N(c)+')'+tail(b)+' = '+N(known))}`,`${M(co(c)+kk+tail(b)+' = '+N(known))} → ${M(co(c)+kk+' = '+N(known-b))} → ${M(kk+' = '+fs(known-b,c))}.`];
      if(c!==1)wn.push([known-b,`You moved ${N(b)} over but forgot to divide by ${N(c)}. ${M(co(c)+kk+' = '+N(known-b))} → ${M(kk+' = '+fs(known-b,c))}.`]);
      wn.push([(known+b)/c,`The ${N(b)} has to move to the other side with the opposite sign: ${N(known)} − ${paren(b)} = ${N(known-b)}, not ${N(known+b)}.`]);
    }else{ // left: mx + k ; right: m2x + b   (k is the constant)
      const m2=nz(-3,3);if(m2===m)continue;known=m2*c+b;k=known-m*c;if(!k)continue;
      rows=[[`${co(m)}${X}${'&nbsp;+&nbsp;'}${kk}`,cond(cl)],[ex({m:m2,b}),cond(cr)]];
      eq=[`${M(co(m)+'('+N(c)+') + '+kk+' = '+N(known))}`,`${M(N(m*c)+' + '+kk+' = '+N(known))} → ${M(kk+' = '+N(known)+' − '+paren(m*c)+' = '+N(k))}.`];
      wn.push([known+m*c,`The ${N(m*c)} on the left moves over with the opposite sign: ${N(known)} − ${paren(m*c)} = ${N(k)}, not ${N(known+m*c)}.`]);
    }
    if(Math.abs(k)>12||(!Number.isInteger(k)&&Math.abs(k*c-Math.round(k*c))>1e-9))continue;
    wn.forEach(z=>{if(Math.abs(z[0]-k)<1e-9)z[0]=NaN});
    return num(k,{prompt:`Find the value of ${kk} that makes ${F(nm)} continuous (no jump) at ${X} = ${N(c)}.`,math:pwRows(rows,nm),whyNum:wn.filter(z=>!isNaN(z[0])),
      alts:[{name:'Check by plugging in',steps:[`Put ${kk} = ${fs(Math.round(k*c),c)} into its piece and evaluate both pieces at ${X} = ${N(c)}.`,`Left piece at ${N(c)}: ${N(type==='A'?k*c+p:type==='B'?known:m*c+k)}. Right piece at ${N(c)}: ${N(type==='A'?known:type==='B'?k*c+b:known)}.`,`They match, so the graph has no jump.`]}],
      hints:[`Continuous means the two pieces meet at the break point, so both pieces must give the same output at ${X} = ${N(c)}.`,
        `Put ${X} = ${N(c)} into each piece and set them equal. The piece without ${kk} gives ${N(known)}, so the piece with ${kk} must also give ${N(known)}: ${eq[0]}.`,
        `Solve: ${eq[1]}`,`${kk} = ${fs(Math.round(k*c),c)}.`]});
  }
}

function oneToOne(){
  let g,yes=Math.random()<.5;
  for(let t=0;t<3000;t++){
    const n=pick([2,3]);
    g=yes?genGraph(n,{jumpOnly:true,mono:pick([1,-1])}):genGraph(n,{jumpOnly:true});
    if(!g)continue;
    const ok=isOneToOne(g.ps);
    if(ok===yes)break;
  }
  const ps=g.ps;
  const yr=p=>{const y1=p.m*p.lo+p.b,y2=p.m*p.hi+p.b;return p.m===0?`only ${Y} = ${N(y1)}`:`${Y} from ${N(Math.min(y1,y2))} to ${N(Math.max(y1,y2))}`};
  let h=null,why;
  if(!yes){
    const flat=ps.find(p=>p.m===0);
    if(flat){h=flat.b;why=`the flat piece at ${Y} = ${N(h)} sits on that whole horizontal line`}
    else{const cands=[];for(let v=-6;v<=6;v+=.5)cands.push(v);cands.sort((a,b)=>(Number.isInteger(b)-Number.isInteger(a))||Math.abs(a)-Math.abs(b));
      h=cands.find(v=>ps.filter(p=>hits(p,v)).length>=2);why=`the horizontal line ${Y} = ${String(h).replace('-','−')} crosses the graph at ${ps.filter(p=>hits(p,h)).length} points`}
  }
  const hs=h===null?'':String(h).replace('-','−');
  const right=yes?'Yes. Every horizontal line crosses the graph at most once.':`No. ${why.charAt(0).toUpperCase()+why.slice(1)}.`;
  const pairs=yes?[
    ['No. The graph has a jump, so it can’t have an inverse.','A jump doesn’t matter. What matters is the horizontal line test, and here the pieces cover different ' + Y + '-values, so no horizontal line hits two of them.'],
    ['No. It is made of different pieces, so it isn’t one-to-one.','Having several pieces isn’t the problem. Check whether any horizontal line hits two pieces; here none does.'],
    ['No. At each break two pieces share the same x-value, so it fails the vertical line test.','At each break only one piece has the closed dot, so the graph is a function (it passes the vertical line test). An inverse needs the horizontal line test instead, and this graph passes that.'],
    ['No. One of the pieces has a negative slope.','The direction of a piece doesn’t matter by itself. The pieces just must not repeat any ' + Y + '-value.']]
  :[
    ['Yes. Each piece is a straight line, and lines are one-to-one.','Each piece alone is one-to-one, but the pieces can share ' + Y + '-values. A horizontal line like ' + Y + ' = ' + hs + ' hits two of them.'],
    ['Yes. It passes the vertical line test.','The vertical line test only shows it is a function. For an inverse, test with horizontal lines: ' + Y + ' = ' + hs + ' crosses it more than once.'],
    ['Yes. The pieces never touch each other.','Not touching isn’t enough. Two pieces can still have the same ' + Y + '-value at different ' + X + '-values, as at ' + Y + ' = ' + hs + '.'],
    ['No. The graph has a jump in it.','A jump isn’t the reason. The real reason is a repeated ' + Y + '-value: the line ' + Y + ' = ' + hs + ' crosses the graph more than once.']];
  return Object.assign(mcw(right,pairs),{prompt:'Does this piecewise function have an inverse that is a function? In other words, is it one-to-one?',
    graph:drawG(g,`Graph of a piecewise linear function made of ${ps.length} line segments`),
    hints:[`A function has an inverse that is a function only if it passes the horizontal line test: no ${Y}-value is used twice.`,
      `Check the heights each piece covers: ${ps.map((p,i)=>`${ord(i)} piece, ${yr(p)}`).join('; ')}. An open circle’s height is not covered by that piece.`,
      yes?`No two pieces share a height, so every horizontal line hits the graph at most once. Yes, it is one-to-one.`:`${why.charAt(0).toUpperCase()+why.slice(1)}. So it is not one-to-one.`]});
}
function hits(p,v){ // does the piece reach height v ?
  if(p.m===0)return p.b===v;
  const x=(v-p.b)/p.m;return owns(p,x);
}
function isOneToOne(ps){
  if(ps.some(p=>p.m===0))return false;
  for(let v=-6;v<=6;v+=.5)if(ps.filter(p=>hits(p,v)).length>=2)return false;
  return true;
}

function ffQ(){
  for(let t=0;t<1000;t++){
    const ps=genF(2),nm=pick(['f','g','h']),c=ps[0].hi,a=R(c-4,c+4),u=val(ps,a);
    if(u===a||Math.abs(u)>12||ownIdx(ps,u)===ownIdx(ps,a))continue;
    const w=val(ps,u),i=ownIdx(ps,a),j=ownIdx(ps,u),pi=ps[i],pj=ps[j];
    const same=pi.m*u+pi.b;
    const wn=[[u,`That is only ${F(nm)}(${N(a)}). The question asks for ${F(nm)} of that answer, so plug ${N(u)} in again.`]];
    if(same!==w&&same!==u)wn.push([same,`You used the ${ord(i)} piece again for the second step, but ${N(u)} satisfies ${M(cond(pj))}, which is the ${ord(j)} piece. Re-check the conditions for the new input.`]);
    return num(w,{prompt:`Find ${F(nm)}(${F(nm)}(${N(a)})).`,math:pw(ps,nm),whyNum:wn.filter(z=>z[0]!==w),
      hints:[`Work from the inside out. First ${F(nm)}(${N(a)}). ${whichHint(ps,a)}`,`${M(F(nm)+'('+N(a)+') = '+sb(pi,N(a))+N(u))}.${pi.m===0?' '+cst(u):''}`,`Now find ${F(nm)}(${N(u)}). The input has changed, so check the conditions again: ${N(u)} fits ${M(cond(pj))}, the ${ord(j)} piece. ${pj.m===0?cst(w):M(sub([pj.b,pj.m],N(u))+' = '+N(w))+'.'}`,`${F(nm)}(${F(nm)}(${N(a)})) = ${N(w)}.`]});
  }
}

function genPiece(L){
  if(L===1)return level1();
  if(L===2)return pick([eval3,readG,domRange,solveQ])();

}

  flip:'Those digits are flipped (like 12 and 21). Read long numbers one digit at a time, left to right.',

function tripScore(q){const raw=[q.prompt,q.math,q.table,...(q.choices||[])].join(' '),t=raw.replace(/<[^>]+>/g,' ');
  return (t.match(/−/g)||[]).length+1.5*(t.match(/[69]/g)||[]).length+(t.match(/\d{2,}/g)||[]).length+2*(raw.match(/<i>[bdpq]<\/i>/g)||[]).length}
function onText(h,fn){let done=false;return h.split(/(<[^>]+>)/).map(p=>{if(done||p.startsWith('<'))return p;const r=fn(p);if(r!==p)done=true;return r}).join('')}
const MIR={
  sign:h=>{let r=onText(h,t=>t.replace(/ [−+] /,m=>m===' − '?' + ':' − '));if(r!==h)return r;r=onText(h,t=>t.replace(/−(?=\d)/,''));if(r!==h)return r;return onText(h,t=>t.replace(/(^|[^\d.])(\d+)/,(m,a,d)=>a+'−'+d))},
  flip:h=>onText(h,t=>t.replace(/\d{2,}/,d=>{const r=d.split('').reverse().join('');return r!==d&&r[0]!=='0'?r:d})),
  sixnine:h=>onText(h,t=>t.replace(/[69]/,c=>c==='6'?'9':'6')),
  letters:h=>{const m={b:'d',d:'b',p:'q',q:'p'};return h.replace(/<i>([bdpq])<\/i>/,(x,c)=>`<i>${m[c]}</i>`)}
};
function addMirror(q){
  if(q.type!=='mc'||q.choices.length<3)return;
  const opts=Object.entries(MIR).map(([k,f])=>[k,f(q.correct)]).filter(([k,m])=>m&&m!==q.correct&&!q.choices.includes(m));
  if(!opts.length)return;
  const [kind,m]=opts[Math.floor(Math.random()*opts.length)];
  const slots=q.choices.map((c,i)=>i).filter(i=>q.choices[i]!==q.correct);
  q.choices[slots[Math.floor(Math.random()*slots.length)]]=m;q.traps={[m]:kind};
}
function trapKind(v,a){if(!Number.isInteger(v)||!Number.isInteger(a)||v===a)return null;
  const A=String(Math.abs(a)),V=String(Math.abs(v));
  if(V===A)return 'sign';
  if(A.length>1&&V===A.split('').reverse().join(''))return 'flip';
  if(/[69]/.test(A)&&V===A.replace(/[69]/g,c=>c==='6'?'9':'6'))return 'sixnine';

function markNegs(root){

function chooseSkill(){

    if(recent[recent.length-1]===s.id)w*=.35;if(recent.slice(-2).every(r=>r===s.id))w*=.1;return w});
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<SK.length;i++){r-=ws[i];if(r<=0)return SK[i].id}return SK[0].id;
}
/* Repeat guard: each topic+level remembers its last SEEN_MAX questions (saved with progress), and
   a new question is drawn until it isn't one of them. Small banks fall back to the one seen longest ago. */
const SEEN_MAX=24,qsig=c=>(c.math||'')+(c.prompt||'')+(c.correct||c.answer);
function newQuestion(){
  const id=chooseSkill(),lvl=st.skills[id].level,key=id+':'+lvl;let q,sig;
  if(!st.seen||typeof st.seen!=='object')st.seen={};const seen=st.seen[key]||(st.seen[key]=[]);
  const age=s=>{const i=seen.lastIndexOf(s);return i<0?Infinity:seen.length-i};   // larger = seen longer ago
  if(dys){let best=null,bs=-1;for(let k=0;k<25;k++){const c=GEN[id](lvl),cs=qsig(c);if(cs===lastSig)continue;const sc=tripScore(c)+Math.random()+(age(cs)===Infinity?100:age(cs));if(sc>bs){bs=sc;best=c}}
    q=best||GEN[id](lvl);addMirror(q)}
  else{let best=null,ba=-1;for(let k=0;k<40;k++){const c=GEN[id](lvl),a=age(qsig(c));if(a===Infinity){best=c;break}if(a>ba){ba=a;best=c}}q=best}
  sig=qsig(q);seen.push(sig);if(seen.length>SEEN_MAX)seen.splice(0,seen.length-SEEN_MAX);save();
  lastSig=sig;recent.push(id);if(recent.length>5)recent.shift();

}

/* Miss log: when the artifact's owner practices, each wrong try is saved to the db doc

const plain=h=>{const d=document.createElement('div');d.innerHTML=String(h||'').replace(/<sup>(.*?)<\/sup>/g,'^$1').replace(/<sub>(.*?)<\/sub>/g,'_$1');return d.textContent.replace(/\s+/g,' ').trim()};
(async()=>{try{

function check(){

  const q=cur.q;let ok,kind=null;
  let why=null;
  if(q.type==='num'){const v=parseNum($('ans').value);if(v===null){fb('Type a number, like 7, −2, 1.5, or 3/2.','info');return}ok=Math.abs(v-q.answer)<1e-9;cur.tried=NA(v,q.dec);
    if(!ok){kind=trapKind(v,q.answer);const hit=(q.whyNum||[]).find(p=>Math.abs(p[0]-v)<1e-9);why=hit?hit[1]:null}}
  else{if(cur.sel===null){fb('Pick an answer first.','info');return}const ch=q.choices[cur.sel];ok=ch===q.correct;
    if(!ok){if(q.traps)kind=q.traps[ch]||null;why=q.why&&q.why[ch]||null}}
  cur.attempts++;cur.why=why;
  if(!ok)logMiss(q,kind,why);
  const s=st.skills[cur.id];
  if(cur.attempts===1){const clean=ok&&cur.hints===0;clean?s.right++:s.wrong++;session.n++;if(clean)session.right++}
  if(kind)st.traps[kind]++;
  ok?onRight(s):onWrong(s,kind);
  save();renderSide();
}
function onRight(s){
  cur.done=true;const name=SKN[cur.id].name;let gain;
  if(q().type==='num'){$('ans').classList.add('good');$('ans').disabled=true}
  else $('answer').querySelectorAll('.choice').forEach(c=>{c.disabled=true;if(+c.dataset.i===cur.sel)c.classList.add('right')});
  const clean=cur.attempts===1&&cur.hints===0;
  if(clean){
    s.streak++;s.misses=0;st.streak++;st.best=Math.max(st.best,st.streak);gain=10*cur.level;
    if(s.level<3&&s.streak>=2){s.level++;s.streak=0;setTimeout(()=>toast(`Level up! ${name} is now Level ${s.level}. Questions get harder.`),450);burst(90)}
    else if(s.level===3&&s.streak>=3&&!s.mastered){s.mastered=true;setTimeout(()=>toast(`You mastered ${name}!`),450);burst(160)}
    else burst(40);
    fb(`${CHECK}<span>${pick(PRAISE)}</span>`,'good');
  }else{
    st.streak=0;s.streak=0;gain=2;
    fb(`${CHECK}<span>Correct${cur.hints?' with a hint':' on a retry'}. That’s practice, but it doesn’t count toward leveling up.</span>`,'good');
  }
  st.points+=gain;floatPts(gain);updateStats(true);setButtons();showAltButtons();
}
function onWrong(s,kind){
  const card=$('card');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
  if(q().type==='num'){$('ans').classList.add('bad');$('ans').select()}
  else{const b=$('answer').querySelector(`[data-i="${cur.sel}"]`);b.classList.add('wrong');b.disabled=true;b.setAttribute('aria-checked','false');cur.sel=null}
  if(cur.attempts===1){
    s.streak=0;st.streak=0;s.misses++;
    if(s.misses>=2&&s.level>1){s.level--;s.misses=0;s.mastered=false;setTimeout(()=>toast(`Moving ${SKN[cur.id].name} back to Level ${s.level} to rebuild.`),300)}
  }
  updateStats(false);
  const said=q().type==='num'?`${cur.tried} isn’t it. `:'';
  if(cur.attempts>=2)fb(`<span>Not quite. ${said}</span> <button class="link" type="button" id="solveBtn">Show me the solution</button>`,'bad');
  else fb(`<span>Not quite. ${said}Try again, or get a hint.</span>`,'bad');
  if(cur.why)$('feedback').insertAdjacentHTML('beforeend',`<span class="whynote"><b>Why that’s wrong:</b> ${cur.why}</span>`);
  if(kind)$('feedback').insertAdjacentHTML('beforeend',`<span class="trapnote">${TRAP[kind]}</span>`);
  if(dys&&cur.why)markNegs($('feedback'));
  const sb=$('solveBtn');if(sb)sb.addEventListener('click',solve);
}
function solve(){
  showAll();cur.done=true;
  const tried=cur.tried?`You answered ${cur.tried}. `:'';
  if(q().type==='num'){const a=$('ans');a.classList.remove('bad');a.classList.add('shown');a.value=NA(q().answer,q().dec);a.disabled=true}
  else $('answer').querySelectorAll('.choice').forEach(c=>{c.disabled=true;if(q().choices[+c.dataset.i]===q().correct)c.classList.add('right')});
  fb(q().type==='num'?`<span>${tried}The correct answer is ${NA(q().answer,q().dec)}. Read the steps, then try the next one.</span>`:'<span>The correct answer is highlighted. Read the steps, then try the next one.</span>','info');setButtons();showAltButtons();save();renderSide();
}
const q=()=>cur.q;

/* ---------- side panel ---------- */
function status(k){const att=k.right+k.wrong;if(!att)return['new','Not started'];if(k.mastered)return['done','Mastered'];if(att>=2&&k.right/att<.6)return['weak','Needs work'];return['lv','Level '+k.level]}
function renderSide(){
  $('skills').innerHTML=SK.map(s=>{const k=st.skills[s.id],[c,t]=status(k),att=k.right+k.wrong,prog=[k.level>1?1:0,k.level>2?1:0,k.mastered?1:(k.level===3?Math.min(k.streak/3,1):0)];
    return `<li class="sk"><div class="row"><span class="nm">${s.name}</span><span class="st ${c}">${t}</span></div><div class="segs ${k.mastered?'done':''}">${prog.map(p=>`<span style="--p:${p}"></span>`).join('')}</div><small>${att?`${k.right} of ${att} right on the first try`:'No questions yet'}</small></li>`}).join('');
  $('session').textContent=session.n?`This session: ${session.n} answered, ${Math.round(100*session.right/session.n)}% right on the first try. Best streak: ${st.best}.`:`Best streak so far: ${st.best}.`;
  const rows=SK.map(s=>{const k=st.skills[s.id],att=k.right+k.wrong;return{s,k,att,acc:att?k.right/att:null}});
  const tried=rows.filter(r=>r.att>=2),untried=rows.filter(r=>r.att===0);
  let html='<h2>What to work on</h2>';
  if(!tried.length){html+=`<p class="big">Answer a few questions first.</p><p>Stay on <b>Mixed</b> and I’ll track which topics trip you up. After a couple of questions per topic, this box tells you where to focus before Wednesday.</p>`}
  else{
    const open=tried.filter(r=>!r.k.mastered).sort((a,b)=>(a.acc-b.acc)||(a.k.level-b.k.level));
    if(!open.length&&!untried.length){html+=`<p class="big">Every topic is mastered.</p><p>Keep going on Mixed to stay sharp. Then get some sleep before the test.</p>`}
    else if(open.length){const w=open[0];const strong=tried.filter(r=>r.k.mastered||r.acc>=.8).map(r=>r.s.name);
      html+=`<p class="big">Focus on ${w.s.name}</p><p>${w.k.right} of ${w.att} right on the first try (${Math.round(100*w.acc)}%), now at Level ${w.k.level}.</p><div class="tip">${w.s.tip}</div><p style="margin-top:12px"><button class="primary" type="button" data-focus="${w.s.id}">Practice ${w.s.name}</button></p>`;
      if(strong.length)html+=`<p class="also">Looking solid: ${strong.join(', ')}.</p>`}
    else html+=`<p class="big">Nice. Now try the rest.</p>`;
    if(untried.length)html+=`<p class="also">Not tried yet: ${untried.map(r=>r.s.name).join(', ')}.</p>`;
  }
  const tr=Object.entries(st.traps).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(tr.length)html+=`<div class="tip" style="margin-top:12px"><b>Reading slips:</b> ${tr.map(([k,v])=>`${TRAPNAME[k]} ×${v}`).join(', ')}.<br>${TRAP[tr[0][0]]}</div>`;
  else if(dys)html+=`<p class="also">Dyslexia mode is on. You’ll see more look-alike numbers, flipped signs and mirror letters on purpose, so you can practice catching them.</p>`;
  $('rec').innerHTML=html;
  const fbtn=$('rec').querySelector('[data-focus]');if(fbtn)fbtn.addEventListener('click',()=>setMode(fbtn.dataset.focus));
}
function renderModes(){
  $('modes').innerHTML=[['mixed','Mixed (adapts to you)'],...SK.map(s=>[s.id,s.name])].map(([id,n])=>`<button type="button" class="chip" aria-pressed="${mode===id}" data-m="${id}">${n}</button>`).join('');
  $('modes').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
}
function setMode(m){mode=m;renderModes();newQuestion();$('card').scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'})}
function updateStats(up){
  $('streak').textContent=st.streak;$('points').textContent=st.points;
  $('streakBox').classList.toggle('hot',st.streak>=3);
  if(up){['streakBox','pointsBox'].forEach(id=>{const e=$(id);e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')})}
}
function floatPts(n){const s=document.createElement('span');s.className='float';s.textContent='+'+n;$('pointsBox').appendChild(s);setTimeout(()=>s.remove(),1000)}
let tt;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}

/* ---------- confetti ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf=null;
function burst(n){
  if(reduce)return;const dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const r=$('checkBtn').getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top;const css=getComputedStyle(document.documentElement);
  const cols=['--accent','--good','--g','--warn'].map(v=>css.getPropertyValue(v).trim());
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.9,sp=5+Math.random()*7;parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:5+Math.random()*5,h:3+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:pick(cols),life:70+Math.random()*30})}
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;cx.save();cx.globalAlpha=Math.min(1,p.life/25);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+30);raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),null)}

/* ---------- wiring ---------- */
$('checkBtn').addEventListener('click',check);
$('hintBtn').addEventListener('click',()=>{cur.done?showAll():showHint();setButtons()});
let armed=false;$('resetBtn').addEventListener('click',()=>{
  if(!armed){armed=true;$('resetBtn').textContent='Click again to erase all progress';setTimeout(()=>{armed=false;$('resetBtn').textContent='Reset progress'},4000);return}
  armed=false;st=fresh();SK.forEach(s=>{st.skills[s.id]={level:1,streak:0,misses:0,right:0,wrong:0,mastered:false}});session={n:0,right:0};save();$('resetBtn').textContent='Reset progress';updateStats(false);renderSide();newQuestion();toast('Progress reset.')});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Enter'&&!(e.target.tagName==='BUTTON')){e.preventDefault();check()}
  if(cur&&cur.q.type==='mc'&&/^[1-4]$/.test(e.key))choose(+e.key-1);
});
const dysBtn=$('dysBtn');
function applyDys(){document.body.classList.toggle('dys',dys);dysBtn.setAttribute('aria-pressed',String(dys))}
applyDys();
dysBtn.addEventListener('click',()=>{dys=!dys;try{localStorage.setItem(KEY+'-dys',dys?'1':'0')}catch(e){}applyDys();
  toast(dys?'Dyslexia mode on: easier-to-read text, plus more look-alike numbers, flipped signs and mirror letters to practice catching.':'Dyslexia mode off.');newQuestion();renderSide()});
/* light/dark: follows the device until the student picks one, then remembers it */
/* Wrapped in try so an old browser can never stop the rest of the app from loading. */
try{
  const lightBtn=$('lightBtn');let darkMQ=null;
  try{darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null}catch(e){}
  let theme=null;try{theme=localStorage.getItem(KEY+'-theme')}catch(e){}
  const applyTheme=()=>{const root=document.documentElement;
    if(theme)root.setAttribute('data-theme',theme);else root.removeAttribute('data-theme');
    const light=theme?theme==='light':!(darkMQ&&darkMQ.matches);lightBtn.setAttribute('aria-pressed',String(light))};
  applyTheme();
  if(darkMQ){if(darkMQ.addEventListener)darkMQ.addEventListener('change',applyTheme);else if(darkMQ.addListener)darkMQ.addListener(applyTheme)}
  lightBtn.addEventListener('click',()=>{theme=lightBtn.getAttribute('aria-pressed')==='true'?'dark':'light';
    try{localStorage.setItem(KEY+'-theme',theme)}catch(e){}applyTheme();toast(theme==='light'?'Light mode on.':'Dark mode on.')});
}catch(e){const b=document.getElementById('lightBtn');if(b)b.hidden=true}
const spk=$('speakBtn');
if(!('speechSynthesis' in window))spk.hidden=true;
else spk.addEventListener('click',()=>{const parts=[speakable($('qBody'))];$('answer').querySelectorAll('.choice .ct').forEach((c,i)=>parts.push(`Choice ${i+1}: ${speakable(c)}.`));
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(parts.join(' '));u.rate=.9;speechSynthesis.speak(u)});
renderModes();updateStats(false);renderSide();newQuestion();
</script>
